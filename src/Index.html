  <!-- ticket 10：圖片燈箱 -->
  <div class="lightbox-overlay" id="lightboxOverlay">
    <button type="button" class="lightbox-close" onclick="closeLightbox()">✕</button>
    <img id="lightboxImage" src="" alt="放大圖片" />
  </div>

  <script>
    // 全域變數狀態
    // 安全性審查 H1 修復＋實際部署後的追加修正（見對話紀錄）：這兩個值
    // 用「不跳脫」樣板插值語法直接印成這個區塊裡的變數宣告，但 Code.js 的
    // toSafeScriptJson_ 已經在伺服器端手動把 JSON 字串裡的尖括號跟 & 轉成
    // \u003c 之類的跳脫序列，攻擊者可控的字元不可能組出「提前關閉這個區塊」
    // 的序列（即使 parseBootstrapParams 已經做了白名單驗證，這裡仍維持
    // 縱深防禦，不依賴單一防線）。曾經試過改放進 body 標籤的 data-* 屬性、
    // 交給 GAS 樣板引擎的「跳脫版」插值語法自動處理，但那套 contextual
    // autoescaper 對自訂 data-* 屬性的情境判斷不可靠，會誤判成網址情境、
    // 把整個值替換成內部的安全佔位字串，導致前端解析直接壞掉——所以改回
    // 這裡手動跳脫、直接印成變數宣告的寫法。
    // 另外要注意：這個區塊裡（含註解文字）不能再出現樣板插值語法本身的
    // 兩種寫法，或是指令碼標籤的開闔文字——GAS 編譯樣板時是整份檔案掃描
    // 這些記號，不理解這裡是註解，寫出來就會讓整份樣板編譯錯亂（這正是
    // 這次追加修正要處理的另一個問題，不是憑空的潔癖）。
    var bootstrapData = <?!= bootstrapDataJson ?>;   // doGet 解析出的 {boardId?, articleId?}，供分享連結深連結使用（Code.js 的 toSafeScriptJson_ 已經手動跳脫過，這裡用不跳脫版印出）
    var scriptBaseUrl = <?!= scriptUrlJson ?>;   // 真正對外的網址，沙盒 iframe 裡的 location.href 不能用
    var currentToken = sessionStorage.getItem('bbs_token') || '';
    var currentUserId = '';
    var currentRole = '';
    var currentPermissions = {}; // 權限系統 ticket 10：取代 04/05/07/08 各自的 currentCanXxx 旗標，
    // 收斂成一份完整的權限物件（articleRead/articlePost/articleManageOwn/
    // replyRead/replyPost/replyDeleteOwn/leaderboard/login）。這裡每一項都
    // 只是全域權限，不含任何特定看板的 AllowRoles——AllowRoles 是每個看板
    // 共用同一個值控管全部 6 種板內動作，使用者能在下拉選單選到的看板／看
    // 得到的文章，本來就已經通過同一個 AllowRoles 的讀取檢查了，這裡不需要
    // 重複算。真正送出動作時，後端各自的 *ForRole 函式依然會重新驗證目標看
    // 板的 AllowRoles，不因為這裡顯示了按鈕就跳過。
    // 優化輪 ticket 07：登入次數/上次登入時間是「這次登入當下」的快照，存 sessionStorage
    // 讓同一個分頁重新整理頁面時還能沿用同一份顯示，不會因為重讀網頁就消失或重新查詢
    var currentLoginCount = sessionStorage.getItem('bbs_login_count') || '';
    var currentLastLoginAt = sessionStorage.getItem('bbs_last_login_at') || '';
    var currentBoardId = '';
    var currentArticleId = '';
    var allBoards = []; // ticket 06：loadBoards() 存一份在這裡，看板列表彈窗直接複用，不用另外查詢

    // @提及輪 ticket 06：handleLogin 收到 res.pendingMentions 後先暫存在這裡，
    // 真正顯示 modal 的時機延後到 loadBoards() 的資料真的回來、allBoards 已經
    // 填好、boardSelect 下拉選單選項也渲染完成之後——這樣使用者點 modal 裡任
    // 一項要切換看板時，selectBoardFromPopup 依賴的那些前置狀態都已經穩定。
    // showPendingMentionsModalIfAny_ 讀取後立刻清空，確保這份清單只顯示這
    // 一次（重整頁面沿用舊 token 走 checkUserStatus 那條路，根本不會有值）。
    var pendingMentionsToShow_ = null;

    // 未讀文章/新回覆徽章（ticket 01）：allBoards 裡每個看板物件已經帶了
    // lastSeenAt（getBoardsFromToken 頁面載入時給的，整個 session 期間不會
    // 再變），呼叫 getBoardBulkFromToken 時原封不動當參數傳回去即可。
    function getBoardLastSeenAt_(boardId) {
      var board = allBoards.find(function (b) { return b.boardId === boardId; });
      return (board && board.lastSeenAt) || '';
    }

    // 未讀文章/新回覆徽章（ticket 01）：只存在瀏覽器記憶體，純粹「這個 session
    // 開過這篇了，不要再顯示徽章」的本地標記，不會寫回伺服器、也不影響
    // lastSeenBoards 本身；離開頁面重整就會消失，這是預期行為。
    var locallyReadArticleIds_ = new Set();
    var lastArticleDetail = null;   // 暫存目前顯示中的文章資料，編輯模式切換時不用重打一次 RPC
    var isEditingArticle = false;
    var editImageList = []; // 圖片張數突破：編輯文章時暫存的圖片清單狀態，原本是固定 3 格

    // ---- 響應式版面：斷點判斷與導覽狀態 (ticket 01) ----
    // 這兩個函式刻意寫成純函式（輸入輸出明確、不碰 DOM），方便之後如果要補測試可以直接抽出來用；
    // 本次照使用者指示先以人工驗收為主，見 MANUAL_VERIFICATION.md。
    var MOBILE_BREAKPOINT = 768;
    var navState = { screen: 'list', articleId: null };
    var viewMode = 'desktop';

    // 純函式：視窗寬度 -> 版面模式（< 768px 為手機版，以視窗寬度即時判斷，不依賴 User-Agent）
    function getViewMode(width) {
      return width < MOBILE_BREAKPOINT ? 'mobile' : 'desktop';
    }

    // 純函式：導覽狀態的 state transition（list -> detail / compose，前進方向用）
    function applyNavAction(state, action) {
      switch (action.type) {
        case 'OPEN_ARTICLE':
          return { screen: 'detail', articleId: action.articleId };
        case 'OPEN_COMPOSE':
          return { screen: 'compose', articleId: null };
        default:
          return state;
      }
    }

    // 接線：依目前 viewMode + navState 套用對應的 body class
    // 桌面版（viewMode !== 'mobile'）一律移除這些 class，維持雙欄版面完全不受影響
    function applyBodyClasses() {
      document.body.classList.remove('mobile-list', 'mobile-detail', 'mobile-compose');
      if (viewMode === 'mobile') {
        document.body.classList.add('mobile-' + navState.screen);
      }
      // 每次畫面切換都順手把「⋯」選單收起來，避免切換後選單還開著
      var moreMenu = document.getElementById('mobileMoreMenu');
      if (moreMenu) moreMenu.classList.remove('open');
    }

    function updateViewMode() {
      viewMode = getViewMode(window.innerWidth);
      applyBodyClasses();
    }

    // 手機版「← 返回」按鈕：交給瀏覽器歷史記錄處理，跟手勢/實體返回鍵走同一條路徑（見 popstate 監聽）
    function backToList() {
      history.back();
    }

    // ticket 02：手機版浮動 ➕ 開啟全螢幕發文頁；關閉時一律用 history.back()，
    // 這樣不管是從 list 還是從 detail 點進來，返回後都會停在原本那個畫面（瀏覽器歷史記錄自然記得），
    // 不用自己額外記一個「從哪裡進來的」變數
    function openMobileCompose() {
      navState = applyNavAction(navState, { type: 'OPEN_COMPOSE' });
      if (viewMode === 'mobile') {
        history.pushState({ screen: 'compose' }, '', '');
      }
      applyBodyClasses();
      document.getElementById('mobileNewArticleTitle').value = '';
      document.getElementById('mobileNewArticleContent').value = '';
      mobileNewArticleImageList = [];
      renderMobileNewArticleImageSlots();
    }

    function closeMobileCompose() {
      history.back();
    }

    function toggleMoreMenu() {
      var menu = document.getElementById('mobileMoreMenu');
      if (menu) menu.classList.toggle('open');
    }

    // 優化輪 ticket 06 起：「⋯」選單改用登記制——各 ticket 各自呼叫 registerMoreMenuItem()
    // 掛自己的入口進去，不用互相知道對方存不存在，也不用同時改到同一段陣列/渲染邏輯，
    // 降低之後平行開發時改到同一塊程式碼互相衝突的風險。
    // 用 id 做 upsert（同一個 id 再呼叫一次是更新，不是疊加新的一筆）——像登入統計這種
    // 內容會隨著登入/登出變動的項目，才不會每次重繪都多出一筆重複的舊資料。
    // onClick 傳 null/undefined 代表這是純資訊列（不能點），例如登入次數。
    var moreMenuItems = [];

    function registerMoreMenuItem(id, label, onClick) {
      var existing = moreMenuItems.find(function(i) { return i.id === id; });
      if (existing) {
        existing.label = label;
        existing.onClick = onClick;
      } else {
        moreMenuItems.push({ id: id, label: label, onClick: onClick });
      }
      renderMoreMenu();
    }

    // ticket 08：跟 registerMoreMenuItem 成對，某些項目（例如排行榜）只有特定角色
    // 看得到，角色不符或登出時要能把項目整個移除，不只是換內容
    function unregisterMoreMenuItem(id) {
      moreMenuItems = moreMenuItems.filter(function(i) { return i.id !== id; });
      renderMoreMenu();
    }

    function renderMoreMenu() {
      var menu = document.getElementById('mobileMoreMenu');
      if (!menu) return;
      if (moreMenuItems.length === 0) {
        menu.innerHTML = '<div class="mobile-more-empty">更多功能即將推出</div>';
        return;
      }
      menu.innerHTML = '';
      moreMenuItems.forEach(function(item) {
        if (!item.onClick) {
          var info = document.createElement('div');
          info.className = 'mobile-more-info';
          info.textContent = item.label;
          menu.appendChild(info);
          return;
        }
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'mobile-more-item';
        btn.textContent = item.label;
        btn.onclick = function() {
          toggleMoreMenu(); // 點了就把選單收起來，再執行實際動作
          item.onClick();
        };
        menu.appendChild(btn);
      });
    }

    // ticket 06：看板列表彈窗，桌面版按鈕在下拉選單旁，手機版收進「⋯」選單
    registerMoreMenuItem('boardList', '📋 看板列表', openBoardListPopup);

    function openBoardListPopup() {
      renderBoardListPopup();
      document.getElementById('boardListPopup').classList.add('open');
    }

    function closeBoardListPopup() {
      document.getElementById('boardListPopup').classList.remove('open');
    }

    function renderBoardListPopup() {
      var body = document.getElementById('boardListPopupBody');
      if (!allBoards || allBoards.length === 0) {
        body.innerHTML = '<div class="placeholder-msg" style="margin:20px; font-size:0.9rem;">尚無可用看板</div>';
        return;
      }
      body.innerHTML = '';
      allBoards.forEach(function(b) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'board-list-popup-item';
        btn.onclick = function() { selectBoardFromPopup(b.boardId); };
        var badge = boardBadgeText(b);
        btn.innerHTML = '<div class="board-name">' + escapeHtml(b.boardName) +
          (badge ? ' <span class="board-badge">' + escapeHtml(badge) + '</span>' : '') + '</div>' +
          (b.description ? '<div class="board-desc">' + escapeHtml(b.description) + '</div>' : '');
        body.appendChild(btn);
      });
    }

    // 點選彈窗裡的看板：行為等同在下拉選單選擇該看板，並關閉彈窗
    function selectBoardFromPopup(boardId) {
      document.getElementById('boardSelect').value = boardId;
      onBoardChange();
      closeBoardListPopup();
    }

    // ---- @提及輪 ticket 06：登入時的提及通知彈窗 ----
    function showPendingMentionsModalIfAny_() {
      var mentions = pendingMentionsToShow_;
      pendingMentionsToShow_ = null; // 只顯示這一次，不管使用者接下來有沒有點開來看
      if (!mentions || mentions.length === 0) return;

      var body = document.getElementById('pendingMentionsPopupBody');
      body.innerHTML = '';
      mentions.forEach(function(m) {
        // boardId 轉看板名稱：用前端已經有的 allBoards 查，不為了取名稱多讀一次
        // 試算表（跟 mentions.js 的 buildMentionEntry_ 沒有存 boardName 是同一個
        // 設計決策）。萬一找不到（例如寫入之後、顯示之前，這個看板的權限被收回
        // 了），退回直接顯示 boardId 本身，不讓整個項目顯示空白。
        var board = allBoards.find(function(b) { return b.boardId === m.boardId; });
        var boardName = board ? board.boardName : m.boardId;

        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'board-list-popup-item';
        btn.onclick = function() { openMentionedArticle_(m.boardId, m.articleId); };
        btn.innerHTML = '<div class="board-name">' + escapeHtml(m.articleTitle) + '</div>' +
          '<div class="board-desc">' + escapeHtml(boardName) + ' · ' + escapeHtml(m.mentionedBy) + ' 提到你 · ' + escapeHtml(m.createdAt) + '</div>';
        body.appendChild(btn);
      });

      document.getElementById('pendingMentionsPopup').classList.add('open');
    }

    function closePendingMentionsPopup() {
      document.getElementById('pendingMentionsPopup').classList.remove('open');
    }

    // 點某一則提及：關掉彈窗、切到該看板，重用既有的深連結開文章機制——
    // loadArticles 的資料真的回來之後，openDeepLinkedArticleIfPending 會自動
    // 開這篇（跟分享連結打開頁面時是同一條路徑，不是另外寫一套）。故意不
    // 呼叫 selectBoardFromPopup：那支函式會連帶關掉 boardListPopup（看板列表
    // 彈窗），跟這裡要關的 pendingMentionsPopup 是兩個不同的彈窗，語意對不上。
    function openMentionedArticle_(boardId, articleId) {
      closePendingMentionsPopup();
      bootstrapData.articleId = articleId;
      document.getElementById('boardSelect').value = boardId;
      onBoardChange();
    }

    // ticket 08：排行榜彈窗
    function openLeaderboardPopup() {
      document.getElementById('leaderboardPopup').classList.add('open');
      document.getElementById('leaderboardPopupBody').innerHTML = '<div class="placeholder-msg" style="margin:20px; font-size:0.9rem;">載入中...</div>';

      google.script.run.withSuccessHandler(function(json) {
        var data = {};
        try { data = JSON.parse(json || '{}'); } catch (e) { data = {}; }
        renderLeaderboardPopup(data);
      }).getLeaderboardFromToken(currentToken);
    }

    function closeLeaderboardPopup() {
      document.getElementById('leaderboardPopup').classList.remove('open');
    }

    function renderLeaderboardPopup(data) {
      var body = document.getElementById('leaderboardPopupBody');
      body.innerHTML =
        renderLeaderboardCategory('🔑 登入次數', data.loginCount) +
        renderLeaderboardCategory('📝 發表文章數', data.articleCount) +
        renderLeaderboardCategory('💬 回覆數', data.replyCount);
    }

    // 平手的使用者共用同一個名次（例如第 2 名有兩人同分，兩人都標示 #2，
    // 下一個不同分數的人才是 #3），不是單純依陣列順序編號
    function renderLeaderboardCategory(title, list) {
      if (!list || list.length === 0) {
        return '<div class="leaderboard-category"><h4>' + escapeHtml(title) + '</h4><div class="leaderboard-empty">尚無資料</div></div>';
      }
      var rows = '';
      var rank = 0;
      var lastValue = null;
      list.forEach(function(item) {
        if (item.value !== lastValue) {
          rank += 1;
          lastValue = item.value;
        }
        rows += '<div class="leaderboard-row"><span class="leaderboard-rank">#' + rank + '</span>' +
          '<span class="leaderboard-user">' + escapeHtml(item.userId) + '</span>' +
          '<span class="leaderboard-value">' + item.value + '</span></div>';
      });
      return '<div class="leaderboard-category"><h4>' + escapeHtml(title) + '</h4>' + rows + '</div>';
    }

    window.addEventListener('resize', updateViewMode);
    // popstate：三種畫面之後，「BACK 一律回 list」不再成立（例如從 detail 開 compose，返回應該回 detail 而不是 list），
    // 改成直接信任瀏覽器自己記錄的 event.state（pushState 當下存的值），沒有 state（回到最原始那一頁）才預設回 list
    window.addEventListener('popstate', function(event) {
      var state = event.state;
      navState = (state && state.screen)
        ? { screen: state.screen, articleId: state.articleId || null }
        : { screen: 'list', articleId: null };
      applyBodyClasses();
    });

    // 頁面初始化
    window.onload = function() {
      updateViewMode();
      checkUserStatus();
      renderNewArticleImageSlots();
      renderMobileNewArticleImageSlots();
    };

    // 1. 檢查並更新使用者權限狀態
    function checkUserStatus() {
      google.script.run.withSuccessHandler(function(json) {
        var status = JSON.parse(json); // 權限系統 ticket 10：getMyStatus 現在含巢狀物件，改回 JSON.stringify/parse
        currentRole = status.role;
        currentUserId = status.userId;
        currentPermissions = status.permissions || {};
        renderTopUserPanel();
        loadBoards();
      }).getMyStatus(currentToken);
    }

    // 2. 渲染頂部欄位的登入/帳號資訊
    function renderTopUserPanel() {
      var panel = document.getElementById('userPanel');
      var leaderboardBtn = document.getElementById('leaderboardBtn');
      var mobileFabBtn = document.getElementById('mobileFabBtn');
      var btnTogglePost = document.getElementById('btnTogglePost');
      if (currentUserId) {
        var loginStatsText = '登入次數: ' + (currentLoginCount || '—') + ' ｜ 上次登入: ' + (currentLastLoginAt || '尚無記錄');
        panel.innerHTML = `
          <span>身份: <strong>${escapeHtml(currentUserId)}</strong> (${currentRole})</span>
          <span class="login-stats-badge">${escapeHtml(loginStatsText)}</span>
          <button class="secondary" onclick="handleLogout()">登出</button>
          <button type="button" class="mobile-more-btn" onclick="toggleMoreMenu()">⋯</button>
        `;
        // 優化輪 ticket 07：手機版收進「⋯」選單裡的資訊列，跟桌面版顯示同一份資料
        registerMoreMenuItem('loginStats', '🔑 ' + loginStatsText, null);

        // 權限系統 ticket 08：排行榜按鈕改依後端回傳的 canViewLeaderboard 動態
        // 判斷，取代原本寫死的 role 字串比對，跟發文按鈕（ticket 04）各自獨立
        // 判斷，不再共用同一個條件式
        if (currentPermissions.leaderboard) {
          if (leaderboardBtn) leaderboardBtn.style.display = '';
          registerMoreMenuItem('leaderboard', '🏆 排行榜', openLeaderboardPopup);
        } else {
          if (leaderboardBtn) leaderboardBtn.style.display = 'none';
          unregisterMoreMenuItem('leaderboard');
        }

        // 權限系統 ticket 04：發文入口（手機浮動 ➕、桌面「+ 發表新文章」）改依
        // 後端回傳的 canPostArticle 動態判斷，取代原本寫死的 role 字串比對——
        // newbie/未登入本來就 canPostArticle 一定是 false，行為不變，只是判斷
        // 依據換成 Permission 表，之後角色可以自由設定
        if (currentPermissions.articlePost) {
          if (mobileFabBtn) mobileFabBtn.style.display = '';
          if (btnTogglePost) btnTogglePost.style.display = '';
        } else {
          if (mobileFabBtn) mobileFabBtn.style.display = 'none';
          if (btnTogglePost) btnTogglePost.style.display = 'none';
        }
      } else {
        panel.innerHTML = `
          <input type="text" id="loginUserId" placeholder="帳號" style="width: 100px;">
          <input type="password" id="loginPassword" placeholder="密碼" style="width: 100px;">
          <button class="btn-primary" onclick="handleLogin()">登入</button>
          <button class="secondary" onclick="handleRegister()">註冊</button>
        `;
        if (leaderboardBtn) leaderboardBtn.style.display = 'none';
        unregisterMoreMenuItem('leaderboard');
        if (mobileFabBtn) mobileFabBtn.style.display = 'none';
        if (btnTogglePost) btnTogglePost.style.display = 'none';
      }
    }

    // 3. 載入看板下拉選單
    // 看板新內容提示功能：N=有新文章，n=有新回覆，兩者都有就是 Nn
    function boardBadgeText(b) {
      var badge = '';
      if (b.hasNewArticle) badge += 'N';
      if (b.hasNewReply) badge += 'n';
      return badge;
    }

    function renderBoardSelectOptions() {
      var select = document.getElementById('boardSelect');
      var previousValue = select.value;
      select.innerHTML = '';
      allBoards.forEach(function(b) {
        var opt = document.createElement('option');
        opt.value = b.boardId;
        var badge = boardBadgeText(b);
        opt.textContent = b.boardName + (badge ? ' ' + badge : '');
        select.appendChild(opt);
      });
      if (previousValue) select.value = previousValue;
    }

    // 使用者進入看板時（下拉選單選、看板列表彈窗點、或頁面載入時預設選中的第一個看板）
    // 都算「看過」：通知後端記錄這個時間點，並立刻在本地清掉這個看板的提示，不用等
    // 下次 loadBoards 才消失。不等後端回應、不處理失敗（背景動作，純顯示用途，
    // 就算這次沒存到，下次再進來還是會正常重新記錄）
    function markBoardEntered(boardId) {
      google.script.run.markBoardSeenFromToken(currentToken, boardId);
      var board = allBoards.find(function(b) { return b.boardId === boardId; });
      if (board) {
        board.hasNewArticle = false;
        board.hasNewReply = false;
      }
      renderBoardSelectOptions();
      renderBoardListPopup();
    }

    function loadBoards() {
      google.script.run.withSuccessHandler(function(json) {
        var boards = [];
        try { boards = JSON.parse(json || '[]'); } catch (e) { boards = []; }
        allBoards = boards; // ticket 06：存起來給看板列表彈窗用

        var select = document.getElementById('boardSelect');
        if (!boards || boards.length === 0) {
          select.innerHTML = '<option value="">(無可用看板)</option>';
          document.getElementById('articleList').innerHTML = '<div class="placeholder-msg" style="margin-top: 40px; font-size: 0.9rem;">無權限或無看板</div>';
          return;
        }

        renderBoardSelectOptions();

        // 深連結：網址帶了 ?board= 就優先選那個看板，否則預設第一個
        var targetBoardId = bootstrapData.boardId;
        var matched = targetBoardId && boards.some(function(b) { return b.boardId === targetBoardId; });
        currentBoardId = matched ? targetBoardId : boards[0].boardId;
        select.value = currentBoardId;

        loadArticles(currentBoardId);
        markBoardEntered(currentBoardId);
        // 效能優化 ticket 05：深連結的 ?article= 現在改成在 loadArticles 的批量資料
        // 真的載回來之後才觸發（見 openDeepLinkedArticleIfPending），不能像以前一樣
        // 在這裡就直接呼叫——文章詳情不再各自獨立呼叫伺服器，要等所屬看板的批量
        // 資料進了本地快取才有東西可以渲染。

        // @提及輪 ticket 06：放在這裡（正常流程都跑完之後），boardSelect 下拉
        // 選單選項、allBoards 都已經穩定，modal 裡任一項需要的「切換看板」才
        // 保證能正確運作。看板數為 0（上面提早 return 的分支）時不會執行到
        // 這裡——一個看板都看不到的人，就算顯示了 mention 也點不進去，不顯示
        // 比顯示了卻導覽失敗更合理。
        showPendingMentionsModalIfAny_();
      }).getBoardsFromToken(currentToken);
    }

    // 切換下拉選單時觸發
    function onBoardChange() {
      currentBoardId = document.getElementById('boardSelect').value;
      currentArticleId = '';
      document.getElementById('rightPanel').innerHTML = '<div class="placeholder-msg">👈 請從左側點選文章查看內容</div>';
      // 看板內搜尋（ticket 04）：換板後上一個看板打的關鍵字沒有意義了，這裡
      // 清空輸入框；isSearching_ 本身會在 loadArticles 觸發的
      // renderArticleListFromCache 裡自動歸零，不用在這裡重複處理。
      var searchInput = document.getElementById('boardSearchInput');
      if (searchInput) searchInput.value = '';
      loadArticles(currentBoardId);
      markBoardEntered(currentBoardId);
    }

    // 效能優化 ticket 05：整版批量快取，取代原本各自獨立的 boardArticleCache
    // （列表，優化輪 ticket 03）與 articleDetailCache（詳情，優化輪 ticket 04）。
    // key 是 boardId，value 是
    // { baseIndex, pages: [{version, articles, repliesByArticleId}, ...], hasMore, totalCount, pageSize }。
    // pages[0] 這張 ticket 交付時永遠只有一頁；ticket 06 之後點「載入更早的文章」
    // 會往陣列後面 push 新的一頁。重新整理頁面會清空（預期行為，之後再進來視同
    // 本次 session 第一次讀取該看板）。
    //
    // 跳頁功能新增了 baseIndex：pages[0] 實際對應到後端哪個 pageIndex（0-based）。
    // 平常（沒跳過頁）baseIndex 永遠是 0，跟原本的假設完全一致；使用者跳頁後，
    // pages 陣列會被整個換成「跳過去的那一頁」單獨一份，baseIndex 記錄那一頁的
    // 真實 pageIndex，「載入更早的文章」則接著從 baseIndex + pages.length 繼續往
    // 後累加，兩種操作方式並存（見 jumpToPage / loadMoreArticles）。totalCount /
    // pageSize 是跳頁 UI 用來換算「共幾頁」的數字，來自 getBoardBulkPage 順手回傳
    // 的既有計算結果（不是額外的讀取或運算，見 boardBulk.js）。
    var boardBulkCache = {};

    // 看板內搜尋（ticket 04）：isSearching_ 為 true 時，#articleList 顯示的是
    // 搜尋結果、不是一般列表；renderArticleListFromCache（一般列表渲染）開頭
    // 會順手把這個旗標歸零，確保「畫面是一般列表」跟「isSearching_ 是 false」
    // 這兩件事不會走鐘——集中在單一個地方同步，不用在每個會清空搜尋的操作
    // 各自記得處理。
    var isSearching_ = false;
    var currentSearchKeyword_ = '';

    // 在已載入的所有頁次裡找一篇文章，回傳所在頁次索引與文章物件本身；找不到回傳
    // null。編輯/刪除/回覆的目標文章不一定在 pages[0]（ticket 06 之後翻頁載入的舊
    // 文章一樣可以被編輯），所以要跨頁找，不能只看第一頁。
    // bug-fix 輪（第八輪之後）：非同步操作與「使用者可能已經點去別的地方」的
    // 競態問題——送出回覆/發文/編輯/刪文之後，在等伺服器回應（或甚至只是等
    // showConfirm 的確認彈窗被點掉）的這段空檔，使用者完全可以點開另一篇文章、
    // 甚至切到另一個看板。等到 google.script.run 的 success callback 真的執行
    // 時，如果 callback 內容用的是「當下」讀到的 currentArticleId/currentBoardId
    // 全域變數，讀到的很可能已經是使用者這段期間點開的新文章/新看板，而不是
    // 這次操作真正對應的那個——結果就是回應被錯誤地套用到畫面上「現在剛好顯示
    // 的東西」，看起來像是回覆跑錯文章、或發文跑錯看板，但實際送給伺服器的
    // RPC 呼叫本身用的是函式參數求值當下（同步、還沒被使用者中途切換影響到）
    // 的值，所以資料庫寫入其實一直是對的——重新整理頁面後看到的就是正確結果。
    // 這個模組確立的修法原則、之後任何新的 google.script.run 呼叫都要延續：
    //   1. 呼叫 google.script.run 之前，先把「這次操作對應哪個看板/哪篇文章」
    //      存進區域變數（targetBoardId/targetArticleId 這類命名），越早存越好
    //      （showConfirm 這種還會再插一層非同步確認的，要存在呼叫 showConfirm
    //      之前，不能存在它的 callback 裡面）。
    //   2. callback 裡凡是要更新「底層快取資料」（boardBulkCache 本身）的部分，
    //      一律用第 1 步存的區域變數，不管使用者是否已經切走，快取永遠都要
    //      正確——這樣使用者之後不管什麼時候點回那篇文章/那個看板，看到的都
    //      已經是最新資料。
    //   3. callback 裡凡是要更新「畫面上看得到的東西」（右側詳情面板、左側
    //      文章列表 DOM）的部分，一律先用下面 isViewingArticle_/isViewingBoard_
    //      比對「現在」的 currentArticleId/currentBoardId 跟第 1 步存的目標值
    //      是否還相同，不同就靜默跳過畫面更新（快取已經在第 2 步更新好了，
    //      不需要現在就打斷使用者、把畫面拉回去）。
    function isViewingArticle_(articleId) {
      return currentArticleId === articleId;
    }
    function isViewingBoard_(boardId) {
      return currentBoardId === boardId;
    }

    function findCachedArticleLocation_(boardId, articleId) {
      var entry = boardBulkCache[boardId];
      if (!entry) return null;
      for (var p = 0; p < entry.pages.length; p++) {
        var article = entry.pages[p].articles.find(function(a) { return a.articleId === articleId; });
        if (article) return { pageIndex: p, article: article };
      }
      return null;
    }

    // 圖片張數突破輪 ticket 02：從 renderArticleListFromCache 抽出來的共用小函式
    // ——把目前看板已載入的所有頁次攤平成單一陣列，DOM 渲染順序（新到舊）跟
    // 這個陣列順序保證一致（renderArticleListFromCache 就是照這個順序逐一
    // appendChild），鍵盤上下鍵導覽靠這個順序找上一篇/下一篇。
    function currentBoardArticlesFlat_(boardId) {
      var entry = boardBulkCache[boardId];
      return entry ? entry.pages.reduce(function(acc, page) { return acc.concat(page.articles); }, []) : [];
    }

    // 看板內搜尋（ticket 04）：跟 currentBoardArticlesFlat_ 同樣道理，把已載入
    // 每一頁各自的 repliesByArticleId（key 是 articleId）合併成一份。文章不會
    // 同時出現在兩頁，key 之間不會互相覆蓋，用 Object.assign 直接合併即可。
    function currentBoardRepliesFlat_(boardId) {
      var entry = boardBulkCache[boardId];
      if (!entry) return {};
      return entry.pages.reduce(function(acc, page) {
        return Object.assign(acc, page.repliesByArticleId);
      }, {});
    }

    // 從 renderArticleListFromCache 抽出來的共用小函式：把一份文章陣列畫成
    // #articleList 底下的 .article-item 清單。一般列表跟搜尋結果都呼叫這個
    // 函式，確保未讀徽章、目前選取中的反藍、點擊開文章這幾件事兩邊行為完全
    // 一致，不會各自維護一份、之後改一邊忘了改另一邊。
    function renderArticleItemsIntoList_(listContainer, articles) {
      listContainer.innerHTML = '';
      articles.forEach(function(item) {
        var div = document.createElement('div');
        div.className = 'article-item' + (item.articleId === currentArticleId ? ' active' : '');
        div.onclick = function() {
          selectArticle(item.articleId, div);
        };
        // 未讀文章/新回覆徽章（ticket 01）：伺服器算出來的 isNew/hasNewReply
        // 之外，還要看這篇這個 session 有沒有已經被本地標記成「開過了」——
        // 開過就不再顯示，不管伺服器那份資料有沒有機會重新整理。
        var alreadyOpenedThisSession = locallyReadArticleIds_.has(item.articleId);
        var showNewArticleBadge = item.isNew && !alreadyOpenedThisSession;
        var showNewReplyBadge = item.hasNewReply && !alreadyOpenedThisSession;
        div.innerHTML = `
          <div class="title" title="${escapeHtml(item.title)}">${showNewArticleBadge ? '<span class="badge-new">N</span>' : ''}${escapeHtml(item.title)}</div>
          <div class="meta">
            <span>${escapeHtml(item.author)}</span>
            <span>${showNewReplyBadge ? '<span class="badge-new">N</span>' : ''}💬${item.replyCount || 0}</span>
          </div>
        `;
        listContainer.appendChild(div);
      });
    }

    function renderArticleListFromCache(boardId) {
      var listContainer = document.getElementById('articleList');
      var articles = currentBoardArticlesFlat_(boardId);

      // 看板內搜尋（ticket 04）：這是「回到一般列表」唯一的進入點，順手把
      // 搜尋狀態歸零、搜尋狀態列藏起來、跳頁 bar 恢復顯示的資格——集中在
      // 這裡做，不用在每個會離開搜尋模式的操作各自記得清。
      isSearching_ = false;
      currentSearchKeyword_ = '';
      var searchStatusBar = document.getElementById('boardSearchStatusBar');
      if (searchStatusBar) searchStatusBar.style.display = 'none';

      renderPagerBar(boardId);

      if (articles.length === 0) {
        listContainer.innerHTML = '<div class="placeholder-msg" style="margin-top: 40px; font-size: 0.9rem;">此看板尚無文章</div>';
        return;
      }

      renderArticleItemsIntoList_(listContainer, articles);

      // 效能優化 ticket 06：hasMore 為 true 時,列表最下方加一顆「載入更早的文章」
      // 按鈕。沒有更多可載入（包含這個看板文章數本來就沒超過批次上限，第一批的
      // hasMore 一開始就是 false）時完全不出現，使用者感覺不到任何差異。
      if (boardBulkCache[boardId] && boardBulkCache[boardId].hasMore) {
        var loadMoreBtn = document.createElement('button');
        loadMoreBtn.id = 'loadMoreArticlesBtn';
        loadMoreBtn.className = 'secondary';
        loadMoreBtn.style.cssText = 'display:block; width:100%; margin-top:8px;';
        loadMoreBtn.textContent = '載入更早的文章';
        loadMoreBtn.onclick = function() { loadMoreArticles(boardId); };
        listContainer.appendChild(loadMoreBtn);
      }
    }

    // ---- 看板內搜尋（ticket 04）----
    // 比對規則：不分大小寫、純子字串比對（跟 @提及輪 ticket 05 的偵測邏輯
    // 同樣走「簡單字串比對」路線，不做分詞或模糊比對）。標題、內文、底下
    // 任一則回覆的內容，符合其中之一就算命中。
    function matchesSearchKeyword_(article, repliesForArticle, keywordLower) {
      if ((article.title || '').toLowerCase().indexOf(keywordLower) !== -1) return true;
      if ((article.content || '').toLowerCase().indexOf(keywordLower) !== -1) return true;
      return (repliesForArticle || []).some(function(reply) {
        return (reply.content || '').toLowerCase().indexOf(keywordLower) !== -1;
      });
    }

    function runSearch_() {
      var input = document.getElementById('boardSearchInput');
      var keyword = (input.value || '').trim();
      if (!keyword) {
        clearSearch_();
        return;
      }
      isSearching_ = true;
      currentSearchKeyword_ = keyword;
      renderSearchResults_(currentBoardId);
    }

    function renderSearchResults_(boardId) {
      var listContainer = document.getElementById('articleList');
      var articles = currentBoardArticlesFlat_(boardId);
      var repliesByArticleId = currentBoardRepliesFlat_(boardId);
      var keywordLower = currentSearchKeyword_.toLowerCase();

      var matched = articles.filter(function(article) {
        return matchesSearchKeyword_(article, repliesByArticleId[article.articleId], keywordLower);
      });

      // 搜尋模式跟跳頁是互斥的兩種列表檢視方式，藏起跳頁 bar、換成搜尋狀態列
      document.getElementById('articlePagerBar').style.display = 'none';
      var statusBar = document.getElementById('boardSearchStatusBar');
      statusBar.style.display = 'flex';
      document.getElementById('searchResultCount').textContent =
        matched.length === 0 ? '沒有符合的結果' : ('找到 ' + matched.length + ' 篇符合的文章');

      // 這個看板還有更早、尚未載入的文章時，讓使用者可以主動擴大範圍——
      // 不自動觸發，重用既有的 loadMoreArticles，它成功後看到 isSearching_
      // 是 true 就會自動重新執行一次搜尋（見下方 loadMoreArticles 的修改）。
      var entry = boardBulkCache[boardId];
      var loadMoreBtn = document.getElementById('searchLoadMoreBtn');
      loadMoreBtn.style.display = (entry && entry.hasMore) ? 'inline-block' : 'none';

      if (matched.length === 0) {
        listContainer.innerHTML = '<div class="placeholder-msg" style="margin-top: 40px; font-size: 0.9rem;">沒有符合「' + escapeHtml(currentSearchKeyword_) + '」的文章</div>';
        return;
      }
      renderArticleItemsIntoList_(listContainer, matched);
    }

    function clearSearch_() {
      var input = document.getElementById('boardSearchInput');
      if (input) input.value = '';
      // renderArticleListFromCache 開頭會把 isSearching_/currentSearchKeyword_
      // 歸零、搜尋狀態列藏起來，這裡不用重複做
      renderArticleListFromCache(currentBoardId);

      // bug-fix 輪：從搜尋結果點進一篇文章、再清除搜尋回到總表時，把那篇文章
      // 捲動到看得到的位置。renderArticleItemsIntoList_ 本來就會依 currentArticleId
      // 幫符合的項目加上 .active（反藍），這裡缺的只是捲動——列表整個重新渲染過，
      // 原本的捲動位置對這篇文章來說已經沒有意義，所以不用像上下鍵導覽那樣只在
      // 「真的被裁到看不見」時才捲（block: 'nearest'），而是直接捲到清單可視範圍
      // 正中間，確保使用者不用自己在長列表裡瞇眼找。找不到（例如目前沒有開啟中
      // 的文章）就靜默略過，不報錯。
      var activeItem = document.querySelector('#articleList .article-item.active');
      if (activeItem) activeItem.scrollIntoView({ block: 'center' });
    }

    // 點「載入更早的文章」：以下一個還沒讀過的頁次（entry.pages.length，0-based）
    // 呼叫批量端點，成功後把新的一頁 push 進既有陣列——只新增，不覆蓋、不重複
    // 讀取已經在 pages 裡的頁次。這一頁本來就還沒載入過，沒有已知版本值可以帶，
    // 一定會整批回傳（不會有 res.unchanged 的情況，這點跟 loadArticles 對第 0 頁
    // 的版本比對不同）。
    function loadMoreArticles(boardId) {
      var entry = boardBulkCache[boardId];
      if (!entry || !entry.hasMore) return; // 沒有更多可載入，或這個看板還沒有任何頁次資料，理論上按鈕不會被畫出來，這裡是保險
      // 跳頁功能後，pages[0] 不一定是後端真正的第 0 頁（見 boardBulkCache 開頭的
      // 說明），下一頁要接著 baseIndex 往後算，不能只看 entry.pages.length
      var nextPageIndex = entry.baseIndex + entry.pages.length;

      // 看板內搜尋（ticket 04）：一般列表模式的按鈕跟搜尋狀態列的按鈕是兩個不同
      // 的 DOM 元素，同一時間只有一個會真的畫在畫面上，另一個 getElementById
      // 會拿到 null，下面用 if (btn) 保護，兩種模式都能有「載入中」的視覺回饋。
      var btn = document.getElementById('loadMoreArticlesBtn');
      if (btn) { btn.disabled = true; btn.textContent = '載入中...'; }
      var searchBtn = document.getElementById('searchLoadMoreBtn');
      if (searchBtn) { searchBtn.disabled = true; searchBtn.textContent = '載入中...'; }

      google.script.run.withSuccessHandler(function(json) {
        var res = {};
        try { res = JSON.parse(json || '{}'); } catch (e) { res = {}; }

        entry.pages.push({ version: res.version, articles: res.articles || [], repliesByArticleId: res.repliesByArticleId || {} });
        entry.hasMore = !!res.hasMore;
        // 理論上總數在這個過程中不會變，但如果剛好有人同時發文/刪文，讓跳頁 UI
        // 的「共幾頁」順手用最新一次讀取結果校正，而不是一直沿用第一次讀到的數字
        if (typeof res.totalCount === 'number') entry.totalCount = res.totalCount;
        if (typeof res.pageSize === 'number') entry.pageSize = res.pageSize;

        // 看板內搜尋（ticket 04）：搜尋模式下載入新的一頁，是「留在搜尋模式、
        // 用擴大後的資料重新搜一次」，不是跳回一般列表——呼叫 renderSearchResults_
        // 而不是 renderArticleListFromCache（後者會把 isSearching_ 歸零）。
        if (isSearching_) {
          renderSearchResults_(boardId);
        } else {
          renderArticleListFromCache(boardId);
        }
      }).withFailureHandler(function(err) {
        if (btn) { btn.disabled = false; btn.textContent = '載入更早的文章'; }
        if (searchBtn) { searchBtn.disabled = false; searchBtn.textContent = '載入更早的文章再搜一次'; }
        showToast('載入更早的文章失敗，請稍後再試: ' + err.message, 'error');
      }).getBoardBulkFromToken(currentToken, boardId, nextPageIndex, '', getBoardLastSeenAt_(boardId));
    }

    // ---- 跳頁功能 ----
    // 跟「載入更早的文章」不同，跳頁不是往 pages 陣列後面疊加，而是直接把陣列
    // 換成「跳過去的那一頁」單獨一份，baseIndex 記錄這一頁的真實 pageIndex。這樣
    // 使用者跳到很舊的頁次後，畫面上看到的就是那一頁本身，不會因為要保留中間所
    // 有頁次而一次抓一大批資料回來。跳完之後仍然可以繼續按「載入更早的文章」，
    // 從 baseIndex 接著往後累加。
    function renderPagerBar(boardId) {
      var bar = document.getElementById('articlePagerBar');
      var entry = boardBulkCache[boardId];

      if (!entry || !entry.totalCount || !entry.pageSize) {
        bar.style.display = 'none';
        return;
      }

      var totalPages = Math.ceil(entry.totalCount / entry.pageSize);
      if (totalPages <= 1) {
        // 跟「載入更早的文章」按鈕一樣的隱藏原則：文章數本來就沒超過一頁的看板，
        // 完全感覺不到這顆 pager bar 存在
        bar.style.display = 'none';
        return;
      }

      var firstPageNum = entry.baseIndex + 1;
      var lastPageNum = entry.baseIndex + entry.pages.length;
      var label = (firstPageNum === lastPageNum)
        ? ('第 ' + firstPageNum + ' 頁 / 共 ' + totalPages + ' 頁')
        : ('第 ' + firstPageNum + '–' + lastPageNum + ' 頁 / 共 ' + totalPages + ' 頁');

      document.getElementById('pagerPageIndicator').textContent = label;
      document.getElementById('pagerPrevBtn').disabled = (entry.baseIndex <= 0);
      document.getElementById('pagerNextBtn').disabled = !entry.hasMore;
      bar.style.display = 'flex';
    }

    // ◀／▶ 箭頭：以目前已載入範圍的邊界為準各跳一頁（如果之前按過幾次「載入更
    // 早的文章」，範圍會超過一頁，箭頭一次只收斂回單獨一頁，不是整個範圍再往前
    // /後移動一頁）
    function pagerGoRelative(delta) {
      var entry = boardBulkCache[currentBoardId];
      if (!entry) return;
      if (delta < 0) {
        if (entry.baseIndex <= 0) return;
        jumpToPage(currentBoardId, entry.baseIndex - 1);
      } else {
        if (!entry.hasMore) return;
        jumpToPage(currentBoardId, entry.baseIndex + entry.pages.length);
      }
    }

    function jumpToPage(boardId, targetPageIndex) {
      if (targetPageIndex < 0) targetPageIndex = 0;
      var entry = boardBulkCache[boardId];

      // 效能優化：目標頁如果剛好已經在目前累積載入的連續範圍內（例如按過幾次
      // 「載入更早的文章」，本地已經有第 0～2 頁），直接從本地資料收斂渲染，不
      // 用為了「跳頁」這個動作特地再打一次伺服器——沿用這輪一路以來「少次量多」
      // 的原則。範圍內第幾頁還有沒有更舊的頁次，看它是不是本地已載入範圍裡的
      // 最後一頁：不是的話，後面那頁本來就已經確定存在（已經載入過），hasMore
      // 一定是 true；剛好是最後一頁才需要沿用伺服器上次告訴我們的 entry.hasMore。
      if (entry && targetPageIndex >= entry.baseIndex && targetPageIndex < entry.baseIndex + entry.pages.length) {
        var localOffset = targetPageIndex - entry.baseIndex;
        var isLastLoadedPage = (localOffset === entry.pages.length - 1);
        boardBulkCache[boardId] = {
          baseIndex: targetPageIndex,
          pages: [entry.pages[localOffset]],
          hasMore: isLastLoadedPage ? entry.hasMore : true,
          totalCount: entry.totalCount,
          pageSize: entry.pageSize
        };
        closePageJumpPopup();
        renderArticleListFromCache(boardId);
        return;
      }

      var listContainer = document.getElementById('articleList');
      listContainer.innerHTML = '<div class="placeholder-msg" style="margin-top: 40px; font-size: 0.9rem;">載入中...</div>';
      closePageJumpPopup();

      google.script.run.withSuccessHandler(function(json) {
        var res = {};
        try { res = JSON.parse(json || '{}'); } catch (e) { res = {}; }

        boardBulkCache[boardId] = {
          baseIndex: targetPageIndex,
          pages: [{ version: res.version, articles: res.articles || [], repliesByArticleId: res.repliesByArticleId || {} }],
          hasMore: !!res.hasMore,
          // unchanged／不允許讀取的分支不會帶 totalCount/pageSize，沿用舊值保底，
          // 避免 pager bar 因為單次回應缺欄位就整個消失
          totalCount: (typeof res.totalCount === 'number') ? res.totalCount : (entry && entry.totalCount),
          pageSize: (typeof res.pageSize === 'number') ? res.pageSize : (entry && entry.pageSize)
        };
        renderArticleListFromCache(boardId);
      }).withFailureHandler(function(err) {
        renderArticleListFromCache(boardId); // 退回原本已快取的畫面，不留在「載入中」
        showToast('跳頁失敗，請稍後再試: ' + err.message, 'error');
      }).getBoardBulkFromToken(currentToken, boardId, targetPageIndex, '', getBoardLastSeenAt_(boardId));
    }

    function jumpToLastPage() {
      var entry = boardBulkCache[currentBoardId];
      if (!entry || !entry.totalCount || !entry.pageSize) return;
      var totalPages = Math.ceil(entry.totalCount / entry.pageSize);
      jumpToPage(currentBoardId, totalPages - 1);
    }

    function openPageJumpPopup() {
      var entry = boardBulkCache[currentBoardId];
      if (!entry || !entry.totalCount || !entry.pageSize) return; // pager bar 本來就該被藏起來，這裡是保險
      var totalPages = Math.ceil(entry.totalCount / entry.pageSize);

      var firstPageNum = entry.baseIndex + 1;
      var lastPageNum = entry.baseIndex + entry.pages.length;
      var currentLabel = (firstPageNum === lastPageNum) ? ('第 ' + firstPageNum + ' 頁') : ('第 ' + firstPageNum + '–' + lastPageNum + ' 頁');
      document.getElementById('pageJumpHint').textContent = '共 ' + totalPages + ' 頁（目前顯示' + currentLabel + '）';
      var input = document.getElementById('pageJumpInput');
      input.min = 1;
      input.max = totalPages;
      input.value = firstPageNum;

      document.getElementById('pageJumpPopup').classList.add('open');
      input.focus();
      input.select();
    }

    function closePageJumpPopup() {
      document.getElementById('pageJumpPopup').classList.remove('open');
    }

    function submitPageJump() {
      var entry = boardBulkCache[currentBoardId];
      if (!entry || !entry.totalCount || !entry.pageSize) { closePageJumpPopup(); return; }
      var totalPages = Math.ceil(entry.totalCount / entry.pageSize);
      var raw = parseInt(document.getElementById('pageJumpInput').value, 10);
      if (isNaN(raw)) return; // 輸入無效（空白或非數字）：不關窗，讓使用者可以直接重新輸入，不用再點一次「跳到指定頁」
      var clamped = Math.min(Math.max(raw, 1), totalPages); // 邊界值 clamp（含 0 或負數），不管使用者輸入什麼都會落在有效範圍內
      jumpToPage(currentBoardId, clamped - 1);
    }

    // 本人發文成功後直接本地插入，不重新呼叫伺服器；新文章一律插進第 0 頁最前面，
    // 跟伺服器端「newest first」排序、以及「新文章永遠出現在最新一頁」的設計一致
    function patchArticleListOnCreate(boardId, version, newArticle) {
      var entry = boardBulkCache[boardId];
      if (!entry || !entry.pages[0]) return false; // 這個看板本次 session 還沒讀過，沒東西可以本地拼接，下次切過去時走正常的完整讀取
      // 跳頁功能：pages[0] 只有在 baseIndex === 0 時才是真正的「最新一頁」，使用者
      // 目前如果正停在跳頁後的某個較舊頁次，這裡不能硬塞——回傳 false 讓呼叫端改
      // 用 loadArticles 整個重新載入（會把 baseIndex 重置回 0），新文章才會正確
      // 出現在使用者眼前，而不是被塞進一頁根本不是最新內容的舊頁次裡
      if (entry.baseIndex !== 0) return false;
      entry.pages[0].articles.unshift(newArticle);
      entry.pages[0].repliesByArticleId[newArticle.articleId] = [];
      entry.pages[0].version = version; // 同步伺服器這次寫入後的新版本，避免下次比對誤判成「有其他異動」
      return true;
    }

    function patchArticleListOnEdit(boardId, version, articleId, newTitle) {
      var located = findCachedArticleLocation_(boardId, articleId);
      if (!located) return false;
      located.article.title = newTitle;
      boardBulkCache[boardId].pages[located.pageIndex].version = version;
      return true;
    }

    function patchArticleListOnDelete(boardId, version, articleId) {
      var entry = boardBulkCache[boardId];
      var located = findCachedArticleLocation_(boardId, articleId);
      if (!entry || !located) return false;
      var page = entry.pages[located.pageIndex];
      page.articles = page.articles.filter(function(a) { return a.articleId !== articleId; });
      delete page.repliesByArticleId[articleId];
      page.version = version;
      return true;
    }

    // 優化輪 ticket 04：本人在文章詳情頁發表/刪除回覆時，順手同步更新看板列表裡
    // 那篇文章旁邊顯示的回覆數徽章（純本地更新，不 bump 看板版本——原因見 ticket 03
    // 「回覆數過期視窗」的取捨說明：只保證自己看到的是準的，別人要等看板版本被
    // 發文/編輯/刪文帶動才會更新）
    // bug-fix 輪：快取本身（replyCount 數字）不管使用者現在切到哪裡都要更新
    // 正確；但 renderArticleListFromCache(boardId) 會直接刷新「現在畫面上看得到
    // 的」#articleList，如果使用者這段期間已經切去別的看板，這裡不能硬刷成
    // 剛剛那個看板的列表（會把使用者現在正在看的看板列表整個換掉）——用
    // isViewingBoard_ 擋一下，只有還停在同一個看板時才真的重新渲染畫面。
    function patchArticleListReplyCount(boardId, articleId, delta) {
      var located = findCachedArticleLocation_(boardId, articleId);
      if (!located) return;
      located.article.replyCount = (located.article.replyCount || 0) + delta;
      if (isViewingBoard_(boardId)) renderArticleListFromCache(boardId);
    }

    // 深連結網址帶了 ?article= 時，要等第一頁批量資料真的載回來才能從快取找到那篇
    // 文章直接渲染（見 loadArticles 的呼叫時機）；只觸發一次，觸發後清掉
    // bootstrapData.articleId，避免之後每次 loadArticles 都重複打開。ticket 07 之後，
    // 這篇文章如果剛好不在第一頁範圍內（找不到），會補上正式的單篇讀取 fallback；
    // 這張 ticket 先讓它顯示「不存在」，不當機、不空白（見 loadArticleDetail）。
    function openDeepLinkedArticleIfPending() {
      if (!bootstrapData.articleId) return;
      var articleId = bootstrapData.articleId;
      bootstrapData.articleId = null;
      selectArticle(articleId, null);
    }

    // 4. 載入左側文章列表 (單行高密度 rendering)。效能優化 ticket 05：一次把第一頁
    // 的文章（含內文/圖片）跟這批文章的全部回覆整批讀回來，之後點開任何一篇文章、
    // 任一則回覆都直接從 boardBulkCache 取用，不再呼叫伺服器。
    //
    // 跳頁功能的已知取捨：這裡永遠是跟後端「真正第 0 頁」的版本鍵比對，所以只有
    // entry.baseIndex 本來就是 0（沒跳頁，或跳頁後又跳回第 0 頁）時，才能拿
    // pages[0].version 當作已知版本去比對、有機會走 unchanged 短路；baseIndex 不是
    // 0 時（使用者切走前正停在跳頁後的某個舊頁次），knownVersion 故意留空，等於
    // 強制真正重讀第 0 頁。實際效果是：切到別的看板、再切回來，會回到這個看板
    // 最新的一頁，不會保留切走前跳到的頁次——這跟大多數論壇「重新進入看板一律看
    // 最新」的習慣一致，也避免了要另外用 baseIndex 當版本鍵的複雜度，已確認這個
    // 代價可以接受。
    function loadArticles(boardId) {
      var listContainer = document.getElementById('articleList');
      listContainer.innerHTML = '<div class="placeholder-msg" style="margin-top: 40px; font-size: 0.9rem;">載入中...</div>';

      var entry = boardBulkCache[boardId];
      var knownVersion = (entry && entry.baseIndex === 0 && entry.pages[0]) ? entry.pages[0].version : '';

      google.script.run.withSuccessHandler(function(json) {
        var res = {};
        try { res = JSON.parse(json || '{}'); } catch (e) { res = {}; }

        if (res.unchanged) {
          // 版本沒變，沿用本地已經快取的資料，不用理會 res 其餘欄位（伺服器這次根本沒撈）
          renderArticleListFromCache(boardId);
          openDeepLinkedArticleIfPending();
          return;
        }

        boardBulkCache[boardId] = {
          baseIndex: 0,
          pages: [{ version: res.version, articles: res.articles || [], repliesByArticleId: res.repliesByArticleId || {} }],
          hasMore: !!res.hasMore,
          totalCount: (typeof res.totalCount === 'number') ? res.totalCount : null,
          pageSize: (typeof res.pageSize === 'number') ? res.pageSize : null
        };
        renderArticleListFromCache(boardId);
        openDeepLinkedArticleIfPending();
      }).getBoardBulkFromToken(currentToken, boardId, 0, knownVersion, getBoardLastSeenAt_(boardId));
    }

    // 5. 折疊/展開發文表單切換
    function togglePostForm() {
      var form = document.getElementById('postArticleForm');
      var btn = document.getElementById('btnTogglePost');
      if (form.style.display === 'none') {
        form.style.display = 'flex';
        btn.style.display = 'none';
      } else {
        form.style.display = 'none';
        btn.style.display = 'block';
      }
    }

    // 6. 點擊文章標題：右側載入內文與回覆
    function selectArticle(articleId, elementNode) {
      currentArticleId = articleId;
      isEditingArticle = false;

      // 未讀文章/新回覆徽章（ticket 01）：點開就在本地標記成「這個 session 看過了」，
      // 並直接把這個節點裡的徽章拿掉——不用整個列表重新渲染。
      locallyReadArticleIds_.add(articleId);
      if (elementNode) {
        elementNode.querySelectorAll('.badge-new').forEach(function (badge) { badge.remove(); });
      }

      // 更新左側高亮顯示
      var items = document.querySelectorAll('.article-item');
      items.forEach(el => el.classList.remove('active'));
      if (elementNode) {
        elementNode.classList.add('active');
        // 上下鍵／手機上一篇下一篇按鈕切換時，反藍的項目可能已經滾出
        // article-list-wrapper 的可視範圍外，用 scrollIntoView 把它捲回可
        // 見範圍。block: 'nearest' 只在真的被裁到看不見時才捲動，已經在畫面
        // 內的情況（例如滑鼠點擊）不會多此一舉地跳位置。scrollIntoView 只會
        // 捲動最近的可捲動祖先（也就是 article-list-wrapper 本身），不會連帶
        // 捲動整個頁面。
        elementNode.scrollIntoView({ block: 'nearest' });
      }

      // 手機版：切換到單畫面「詳情」畫面，並推一筆瀏覽器歷史記錄，
      // 讓實體/手勢返回鍵可以回到列表（見 popstate 監聽）。
      // 只有「真的從別的畫面切進來」才 push 新的一筆——如果已經在 detail 畫面
      // 只是重新整理同一篇文章（例如發完回覆後刷新），不重複推疊歷史記錄，
      // 不然手機返回鍵會需要按兩次才能真的離開這篇文章。
      var wasAlreadyInDetail = (viewMode === 'mobile' && navState.screen === 'detail');
      navState = applyNavAction(navState, { type: 'OPEN_ARTICLE', articleId: articleId });
      if (viewMode === 'mobile' && !wasAlreadyInDetail) {
        history.pushState({ screen: 'detail', articleId: articleId }, '', '');
      }
      applyBodyClasses();

      loadArticleDetail(articleId);
    }

    // 效能優化 ticket 05：不再需要獨立的文章詳情快取——文章跟回覆已經在
    // loadArticles 進板時整批讀進 boardBulkCache 了（見上方），已載入的情況下
    // 這裡純粹是本地查找 + 渲染，不呼叫伺服器。
    // 效能優化 ticket 07：不在已載入頁次範圍內時（深連結指到舊文章、或使用者
    // 還沒點「載入更早的文章」翻到那一頁），改呼叫既有的 getArticleDetailFromToken
    // 單篇補讀，不觸發整個看板的批量載入。刻意不把補讀到的結果併入 boardBulkCache
    // 的頁次結構——那會弄亂「載入更早的文章」的頁次計算（下一頁該從哪裡開始），
    // 也可能讓同一篇文章在批量資料真的涵蓋到它的時候重複出現。lastArticleDetail
    // 是唯一存放「目前右側面板顯示什麼」的地方，不管資料是從哪個管道拿到的。
    function loadArticleDetail(articleId) {
      var rightPanel = document.getElementById('rightPanel');
      var located = findCachedArticleLocation_(currentBoardId, articleId);

      if (located) {
        var page = boardBulkCache[currentBoardId].pages[located.pageIndex];
        var data = { article: located.article, replies: page.repliesByArticleId[articleId] || [] };
        lastArticleDetail = data;
        renderArticleDetail(data);
        return;
      }

      rightPanel.innerHTML = '<div class="placeholder-msg">文章載入中...</div>';

      google.script.run.withSuccessHandler(function(json) {
        var res = null;
        try { res = JSON.parse(json || 'null'); } catch (e) { res = null; }

        if (!res || !res.article) {
          // 找不到、或這個角色沒有權限看——兩種情況刻意顯示同一句話，不透露是哪一種
          // （跟 getArticleDetailForSnapshot 的既有設計一致，見該函式的說明）
          rightPanel.innerHTML = '<div class="placeholder-msg">文章不存在或已被刪除</div>';
          lastArticleDetail = null;
          return;
        }

        var fallbackData = { article: res.article, replies: res.replies || [] };
        lastArticleDetail = fallbackData;
        renderArticleDetail(fallbackData);
      }).getArticleDetailFromToken(currentToken, articleId, '');
    }

    // 本人回覆成功後直接本地插入，不重新呼叫伺服器；回覆是「舊到新」排序，
    // 新的回覆排最後面。bug-fix 輪：boardId 改成參數（不再讀 currentBoardId
    // 全域變數，避免使用者切看板期間這支函式解析到錯的看板快取）；回傳值也從
    // true/false 改成「更新後的 {article, replies}／null」，不在這裡直接寫
    // lastArticleDetail——是否要同步到看得到的右側面板，交給呼叫端用
    // isViewingArticle_ 判斷過後再決定（見上方 bug-fix 輪的說明區塊）。
    function patchArticleDetailOnReplyCreate(boardId, articleId, version, newReply) {
      var located = findCachedArticleLocation_(boardId, articleId);
      if (!located) return null;
      var page = boardBulkCache[boardId].pages[located.pageIndex];
      if (!page.repliesByArticleId[articleId]) page.repliesByArticleId[articleId] = [];
      page.repliesByArticleId[articleId].push(newReply);
      page.version = version;
      return { article: located.article, replies: page.repliesByArticleId[articleId] };
    }

    function patchArticleDetailOnReplyDelete(boardId, articleId, version, replyId) {
      var located = findCachedArticleLocation_(boardId, articleId);
      if (!located) return null;
      var page = boardBulkCache[boardId].pages[located.pageIndex];
      page.repliesByArticleId[articleId] = (page.repliesByArticleId[articleId] || []).filter(function(r) { return r.replyId !== replyId; });
      page.version = version;
      return { article: located.article, replies: page.repliesByArticleId[articleId] };
    }

    function patchArticleDetailOnEdit(boardId, articleId, version, title, content, editedAt, editedBy, imageUrls) {
      var located = findCachedArticleLocation_(boardId, articleId);
      if (!located) return null;
      located.article.title = title;
      located.article.content = content;
      located.article.editedAt = editedAt;
      located.article.editedBy = editedBy;
      if (imageUrls) {
        located.article.imageUrls = imageUrls;
      }
      var page = boardBulkCache[boardId].pages[located.pageIndex];
      page.version = version;
      return { article: located.article, replies: page.repliesByArticleId[articleId] || [] };
    }

    // 6b. 實際組裝右側文章詳情 HTML（含檢視 / 編輯兩種模式）
    // ticket 09/10：文章下方縮圖，點擊以燈箱放大顯示
    // 圖片張數突破：從固定顯示最多 3 張（imageUrl1~3），改成縮圖網格，
    // 任意張數都能顯示；點擊任一縮圖開燈箱瀏覽。
    // 安全性審查 H3 殘留風險（見交接文件）：舊版這裡是用 inline
    // onclick="openLightbox('...')" 把網址字串插進屬性裡綁事件，
    // escapeHtml() 對這種寫法其實不是有效的輸出端防禦。這次改寫縮圖網格
    // 順手修掉：不再產生 onclick 屬性字串，img 只是普通的 <img>，實際綁
    // 事件的地方在下面的 rightPanel 委派監聽（見那裡的說明），用
    // addEventListener、讀 DOM 自己的 .src 屬性，不再手動插值組字串。
    function renderArticleImages(article) {
      var urls = (article.imageUrls || []).filter(function(u) { return u; });
      if (urls.length === 0) return '';
      var imgs = urls.map(function(u) {
        return '<img src="' + escapeHtml(u) + '" alt="文章附加圖片" class="article-image-thumb" />';
      }).join('');
      return '<div class="article-images">' + imgs + '</div>';
    }

    // rightPanel 是文章詳情的固定容器，每次切換文章只換裡面的 innerHTML，
    // 容器本身不會被整個換掉，監聽器綁一次就一直有效，不用每次重繪內容
    // 後重新綁——比起在動態產生的每張縮圖上各自 addEventListener（那樣
    // 每次 innerHTML 更新後舊的監聽器就失效，還要記得重新綁），事件委派
    // 在這種「內容常換、容器不換」的情境下更省事也更不容易漏綁。
    document.getElementById('rightPanel').addEventListener('click', function(event) {
      if (event.target && event.target.classList.contains('article-image-thumb')) {
        openLightbox(event.target.src);
      }
    });

    var lightboxImageIndex = -1; // 圖片張數突破輪 ticket 06：目前燈箱顯示的圖片，在 lastArticleDetail.article.imageUrls 裡的 index，燈箱沒開時是 -1

    function openLightbox(url) {
      document.getElementById('lightboxImage').src = url;
      document.getElementById('lightboxOverlay').classList.add('open');
      var urls = (lastArticleDetail && lastArticleDetail.article && lastArticleDetail.article.imageUrls) || [];
      lightboxImageIndex = urls.indexOf(url);
    }

    function closeLightbox() {
      document.getElementById('lightboxOverlay').classList.remove('open');
      document.getElementById('lightboxImage').src = '';
      lightboxImageIndex = -1;
    }

    // ticket 06：燈箱開著時，左右鍵切換同一篇文章的上一張/下一張圖片。
    // 邊界（第一張按左鍵、最後一張按右鍵）停住不動，跟 ticket 02 的
    // selectAdjacentArticle_ 上下鍵邊界處理是同一個慣例，不wrap。只有
    // 一張圖片時 urls.length <= 1，怎麼按都不會動，不會出錯。
    function navigateLightbox_(direction) {
      var urls = (lastArticleDetail && lastArticleDetail.article && lastArticleDetail.article.imageUrls) || [];
      if (urls.length <= 1 || lightboxImageIndex === -1) return;
      var targetIndex = lightboxImageIndex + direction;
      if (targetIndex < 0 || targetIndex >= urls.length) return;
      openLightbox(urls[targetIndex]);
    }

    function isLightboxOpen_() {
      var overlay = document.getElementById('lightboxOverlay');
      return !!(overlay && overlay.classList.contains('open'));
    }

    // ---- 圖片張數突破輪 ticket 02：桌面雙欄版面鍵盤導覽 ----

    // ↑/↓：切換到目前選定文章在已載入清單裡的上一篇（較新）/下一篇（較舊）。
    // direction: -1 = 上一篇, +1 = 下一篇。已經在清單邊界（最新的一篇按上鍵、
    // 最舊的一篇按下鍵）時停住不動，不觸發翻頁——翻頁另外交給左右鍵。
    // 目前沒有選定文章、或選定的文章不在目前已載入清單裡（例如深連結補讀到的
    // 舊文章），一律不動作，不猜測使用者想跳去哪。
    function selectAdjacentArticle_(direction) {
      var articles = currentBoardArticlesFlat_(currentBoardId);
      var index = articles.findIndex(function(a) { return a.articleId === currentArticleId; });
      if (index === -1) return;
      var targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= articles.length) return;
      var targetEl = document.querySelectorAll('.article-item')[targetIndex]; // DOM 順序保證跟 articles 陣列順序一致，見 currentBoardArticlesFlat_ 的說明
      selectArticle(articles[targetIndex].articleId, targetEl || null);
    }

    // 手機導覽補強輪 ticket 01：算出目前文章在清單裡是否還有上一篇/下一篇，
    // 供手機版固定按鈕決定要不要顯示 disabled 態。跟 selectAdjacentArticle_
    // 用同一份 currentBoardArticlesFlat_ 資料源、同一套「目前文章不在已載入
    // 清單裡就當作沒有上下篇」的邊界判斷，避免兩處各自維護一份容易兜不起來。
    function mobileAdjacentArticleAvailability_() {
      var articles = currentBoardArticlesFlat_(currentBoardId);
      var index = articles.findIndex(function(a) { return a.articleId === currentArticleId; });
      if (index === -1) return { hasPrev: false, hasNext: false };
      return { hasPrev: index > 0, hasNext: index < articles.length - 1 };
    }

    // Ctrl+K：開啟發文表單，已經開著就不做任何事（不是 toggle，避免快捷鍵
    // 意外把表單關掉），並把游標帶到標題欄位，開完就能直接打字。
    function openPostFormIfClosed_() {
      var form = document.getElementById('postArticleForm');
      if (form && form.style.display === 'none') {
        togglePostForm();
      }
      var titleInput = document.getElementById('newArticleTitle');
      if (titleInput) titleInput.focus();
    }

    // 只在桌面雙欄版面生效（手機版單畫面導覽邏輯不同，見 selectArticle 裡
    // wasAlreadyInDetail 的說明，這裡不處理手機版）。焦點在輸入框（標題/
    // 內容/回覆等文字輸入區）時，除了 Esc 以外全部略過，不影響正常打字；
    // Esc 不管焦點在哪都生效，因為「關掉彈出的東西」不該被輸入框擋住。
    document.addEventListener('keydown', function(event) {
      if (viewMode !== 'desktop') return;

      if (event.key === 'Escape') {
        closeBoardListPopup();
        closePageJumpPopup();
        closeLightbox();
        return;
      }

      var isTyping = event.target && (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA');
      if (isTyping) return;

      if (event.key === 'ArrowUp') {
        event.preventDefault();
        selectAdjacentArticle_(-1);
      } else if (event.key === 'ArrowDown') {
        event.preventDefault();
        selectAdjacentArticle_(1);
      } else if (event.key === 'ArrowLeft') {
        event.preventDefault();
        // ticket 06：燈箱開著時左右鍵讓位給切換圖片，關掉燈箱（Esc）後
        // 自動恢復成切頁——不需要另外記狀態切換，isLightboxOpen_ 當下
        // 讀 DOM 的 class 就是最新狀態。
        if (isLightboxOpen_()) {
          navigateLightbox_(-1);
        } else {
          pagerGoRelative(-1); // 既有的◀箭頭按鈕邏輯，見 pagerGoRelative 的說明
        }
      } else if (event.key === 'ArrowRight') {
        event.preventDefault();
        if (isLightboxOpen_()) {
          navigateLightbox_(1);
        } else {
          pagerGoRelative(1);
        }
      } else if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
        // metaKey 一併處理是為了 Mac 的 Cmd+K，跟 Windows/Linux 的 Ctrl+K
        // 是同一個快捷鍵、不是另外新增的功能。Ctrl+K 本身不是任何主流瀏覽器
        // 鎖死的保留鍵（不像 Ctrl+N/T/W），可以放心 preventDefault。
        event.preventDefault();
        openPostFormIfClosed_();
      }
    });

    // ---- 手機導覽補強輪 ticket 02：手機版左右滑動切換上一篇/下一篇 ----
    // 只在 viewMode === 'mobile' 且目前在 detail 畫面時生效——桌面版已經有
    // ↑/↓ 快捷鍵（見上面的 keydown 監聽），不需要也不該讓桌面瀏覽器意外
    // 觸發這組手勢（桌面瀏覽器一般不會有 touch 事件，這裡的 viewMode 檢查
    // 是多一層保險，不是主要防線）。
    // 選左右滑而不是上下滑：文章內文本身要垂直捲動，上下滑動的手勢會跟
    // 捲動打架、分不清使用者是想捲頁還是想切文章；左右滑動不影響垂直捲動，
    // 也剛好跟桌面版「↑↓ 切文章、←→ 翻頁」的左右軸對應到「換內容」的
    // 直覺一致。
    // 效率面：底層一樣呼叫 selectAdjacentArticle_ -> selectArticle ->
    // loadArticleDetail，走既有的「先查 boardBulkCache 本地資料，沒有才
    // 補打後端」路徑（見 loadArticleDetail 的說明），前後篇文章本來就已經
    // 在使用者瀏覽這個看板的過程中批次讀進 boardBulkCache 了，這裡新增的
    // 手勢入口不會多打一次試算表讀取，跟桌面鍵盤導覽是同一份效率優化成果。
    // 安全面：不新增任何使用者輸入或動態 HTML 組裝，純粹是觸發既有、已經
    // 通過權限檢查與 escapeHtml 處理的 selectArticle／renderArticleDetail
    // 路徑，不擴大攻擊面。
    // 綁在 #rightPanel 上而不是每次重繪都重建的內部節點——rightPanel 本身
    // 是穩定存在的容器（只有 innerHTML 會變），道理同 wireImageDropZone_
    // 的說明，一次綁定，之後每次重繪依然有效。
    //
    // 這三個門檻常數提到外層（不再各自關在 IIFE 裡），因為未讀/新回覆徽章輪
    // ticket 02 新增的燈箱滑動手勢要重用同一套數值，兩處手感才會一致。
    // 起點在螢幕最左緣一小段範圍內時，整段手勢直接放行、不攔截：iOS
    // Safari 從最左緣往右滑是系統「上一頁」手勢，這裡刻意不跟它搶。
    var EDGE_IGNORE_PX = 24;
    var SWIPE_MIN_DELTA_X = 60; // 位移門檻：太小的位移視為誤觸/正常點擊，不觸發切換
    var SWIPE_MAX_OFF_AXIS_RATIO = 0.5; // 縱向位移超過橫向位移的一半，視為在捲動內文，不是要切文章

    (function () {
      var rightPanelEl = document.getElementById('rightPanel');
      var touchStartX = null;
      var touchStartY = null;
      var touchStartEdge = false;

      rightPanelEl.addEventListener('touchstart', function (event) {
        if (viewMode !== 'mobile' || navState.screen !== 'detail') return;
        if (isLightboxOpen_()) return; // 燈箱開著時滑動交給燈箱自己的手勢監聽（見下方），不會誤觸這裡的邏輯，但仍明確排除
        var target = event.target;
        if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA')) return; // 在回覆輸入框打字/選字時不要誤觸
        var touch = event.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
        touchStartEdge = touch.clientX <= EDGE_IGNORE_PX;
      }, { passive: true });

      rightPanelEl.addEventListener('touchend', function (event) {
        if (touchStartX === null || touchStartEdge) {
          touchStartX = null;
          touchStartY = null;
          touchStartEdge = false;
          return;
        }
        var touch = event.changedTouches[0];
        var deltaX = touch.clientX - touchStartX;
        var deltaY = touch.clientY - touchStartY;
        touchStartX = null;
        touchStartY = null;
        touchStartEdge = false;

        if (Math.abs(deltaX) < SWIPE_MIN_DELTA_X) return;
        if (Math.abs(deltaY) > Math.abs(deltaX) * SWIPE_MAX_OFF_AXIS_RATIO) return;

        // 往左滑（deltaX 負）＝下一篇（較舊），往右滑（deltaX 正）＝上一篇
        // （較新），跟 selectAdjacentArticle_ 的 direction 定義（-1=上一篇,
        // +1=下一篇）對應，行為（含清單邊界時停住不動）跟按鈕、桌面快捷鍵
        // 完全一致，同一套函式、同一套邊界判斷。
        selectAdjacentArticle_(deltaX < 0 ? 1 : -1);
      }, { passive: true });
    })();

    // ---- 未讀/新回覆徽章輪 ticket 02：手機燈箱左右滑動切圖 ----
    // 跟上面的文章切換手勢是完全獨立的手勢區塊（不同 DOM 目標、不同觸發條件），
    // 但共用同一套門檻常數（EDGE_IGNORE_PX/SWIPE_MIN_DELTA_X/SWIPE_MAX_OFF_AXIS_RATIO，
    // 見上方宣告處），確保兩處滑動手感一致、以後要調整門檻只要改一個地方。
    // 方向對應 navigateLightbox_ 既有的桌面鍵盤慣例（ArrowRight=+1=下一張,
    // ArrowLeft=-1=上一張）：左滑＝下一張、右滑＝上一張。邊界（第一張再右滑/
    // 最後一張再左滑）完全不動作，直接沿用 navigateLightbox_ 既有的邊界判斷，
    // 這裡不用另外處理。
    (function () {
      var lightboxOverlayEl = document.getElementById('lightboxOverlay');
      var touchStartX = null;
      var touchStartY = null;
      var touchStartEdge = false;
      // 一次成功辨識出的滑動手勢，接下來瀏覽器可能補發的合成 click 事件要
      // 忽略，不然會被下面統一處理的 click handler 誤判成「點背景關閉燈箱」。
      // 旗標在下一個 tick 用 setTimeout 保底清除，避免萬一沒有真的補發
      // click（不同瀏覽器行為不一致）時旗標卡住不歸位、誤吃下一次正常點擊。
      var justSwiped = false;

      lightboxOverlayEl.addEventListener('touchstart', function (event) {
        var touch = event.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
        touchStartEdge = touch.clientX <= EDGE_IGNORE_PX; // 燈箱是滿版 overlay，左緣一樣要讓給 iOS 返回手勢
      }, { passive: true });

      lightboxOverlayEl.addEventListener('touchend', function (event) {
        if (touchStartX === null || touchStartEdge) {
          touchStartX = null;
          touchStartY = null;
          touchStartEdge = false;
          return;
        }
        var touch = event.changedTouches[0];
        var deltaX = touch.clientX - touchStartX;
        var deltaY = touch.clientY - touchStartY;
        touchStartX = null;
        touchStartY = null;
        touchStartEdge = false;

        if (Math.abs(deltaX) < SWIPE_MIN_DELTA_X) return;
        if (Math.abs(deltaY) > Math.abs(deltaX) * SWIPE_MAX_OFF_AXIS_RATIO) return;

        justSwiped = true;
        setTimeout(function () { justSwiped = false; }, 0);

        navigateLightbox_(deltaX < 0 ? 1 : -1);
      }, { passive: true });

      // 原本 overlay 是用 inline onclick="closeLightbox()"（見 Index.html
      // 這個節點的標記），改成這裡統一處理，理由：inline onclick 是在 DOM
      // 解析當下就註冊的，時間點一定比這支 script 裡任何 addEventListener
      // 呼叫還早，如果兩個監聽器分別用 capture/bubble 卡順序去猜誰先執行，遇到
      // 「點擊座標剛好就是 overlay 本身（不是內部的 img）」時順序其實無法
      // 保證一定是 capture 那個先跑——與其賭事件流順序，不如讓「要不要真的
      // 關閉燈箱」這個判斷只在單一個 handler 裡做完，順便也保留原本「點擊
      // 背景（不管是點在 img 上還是 overlay 空白處）就關閉」的行為：一般點
      // 擊（deltaX 太小、沒有觸發 justSwiped）沿用原本 tap-to-close，只有
      // 真的辨識出滑動手勢時才略過這一次。
      lightboxOverlayEl.addEventListener('click', function (event) {
        if (justSwiped) {
          justSwiped = false;
          return;
        }
        closeLightbox();
      });
    })();

    // 圖片張數突破：編輯文章時的圖片管理——不定長清單，每項是既有圖片
    // （可移除）或新選的圖片（可移除），清單後接一個新增圖片的控制項
    function renderEditImageSlots() {
      return renderImageListHtml(editImageList, 'addEditImage', 'removeEditImage', 'moveEditImage') +
        '<div class="image-upload-warning">⚠️ 圖片連結為公開分享連結（知道連結就能看），請勿上傳含敏感內容的圖片</div>';
    }

    function moveEditImage(index, direction) {
      moveImageInList_(editImageList, index, direction);
      renderArticleDetail(lastArticleDetail);
    }

    function removeEditImage(index) {
      editImageList.splice(index, 1);
      renderArticleDetail(lastArticleDetail);
    }

    function addEditImage(inputEl) {
      tryAddDroppedFiles_(editImageList, inputEl.files, function() { renderArticleDetail(lastArticleDetail); });
      inputEl.value = ''; // 清空，不然選同一批檔案時瀏覽器不會再次觸發 change
    }

    function renderArticleDetail(data) {
      var article = data.article;
      var replies = data.replies || [];
      // 權限系統 ticket 05：canManageArticle 除了本人判斷之外，也要求該角色
      // 真的有 articleManageOwn 權限——原本只看 author === currentUserId，
      // 沒有查權限，只是剛好過去能發文的角色都有編輯刪除本人的權限才沒露餡
      var canManageArticle = (currentRole === 'admin' || (currentPermissions.articleManageOwn && article.author === currentUserId));
      var rightPanel = document.getElementById('rightPanel');

      var headerHtml;
      if (isEditingArticle) {
        headerHtml = `
          <input type="text" id="editArticleTitle" value="${escapeHtml(article.title)}"
            style="width:100%; font-size:1.3rem; font-weight:bold; margin-bottom:8px; padding:6px; border:1px solid var(--color-border-strong); border-radius:6px;">
          <textarea id="editArticleContent" style="width:100%; height:140px; padding:8px; border:1px solid var(--color-border-strong); border-radius:6px; margin-bottom:8px;">${escapeHtml(article.content)}</textarea>
          ${renderEditImageSlots()}
          <div style="display:flex; gap:8px; margin-top:8px;">
            <button class="btn-primary" id="btnSaveEditArticle">儲存</button>
            <button class="secondary" onclick="handleCancelEditArticle()">取消</button>
          </div>
        `;
      } else {
        headerHtml = `
          <div class="header-title" style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
            <span>${escapeHtml(article.title)}</span>
            <div style="display:flex; gap:6px; flex-shrink:0;">
              <button class="secondary" id="btnShareArticle" style="font-size:0.75rem; padding:4px 10px;">🔗 分享</button>

    // ---- ticket 09/10 → 圖片張數突破輪改成不定長清單：圖片上傳前處理 ----

    var IMAGE_UPLOAD_BATCH_BYTES = 8 * 1024 * 1024;

    // 共用的單一檔案驗證（格式/大小），選圖當下就檔，不用等送出後端才發現被拒絕
    function validateImageFile(file) {

        showToast('圖片格式僅支援 jpg/png/gif/webp：' + file.name, 'error');
        return false;
      }
      if (file.size > MAX_IMAGE_SIZE_BYTES) {
        showToast('圖片檔案大小不能超過 5MB：' + file.name, 'error');
        return false;

      return true;
    }

    // 圖片張數突破：加入一張新選圖片前的兩道檢查——格式/大小、張數上限，

    // 見下方 uploadImagesInBatches 的說明。）
    function canAddImageToList_(list, file) {
      if (!validateImageFile(file)) return false;

        return false;

        html += '<button type="button" class="secondary" style="font-size:0.75rem; padding:2px 8px;" onclick="' + removeFnName + '(' + i + ')">移除</button>';
        html += '</div>';
        html += '</div>';
      });

    // disabled，這裡的邊界判斷純粹是保險，不依賴按鈕一定被正確停用）。
    // 桌面發文/手機發文/編輯文章三處呼叫，共用同一段邏輯、同一種邊界處理。
    function moveImageInList_(list, index, direction) {
      var targetIndex = index + direction;
      if (index < 0 || index >= list.length || targetIndex < 0 || targetIndex >= list.length) {
        return;
      }
      var tmp = list[index];
      list[index] = list[targetIndex];
      list[targetIndex] = tmp;
    }

    // 從 list 裡取出真正要上傳的 File 物件（既有連結字串跳過）
    function filesFromImageList(list) {

    // 加入單一檔案，不觸發重繪——給批次加入時用，重繪留給呼叫端在整批跑完
    // 後只做一次，不要選 5 張圖就重繪 5 次。
    function tryAddImageWithoutRerender_(list, file) {
      if (!file) return;
      if (!canAddImageToList_(list, file)) return;
      list.push(file);
    }

    // 批次加入一組檔案（FileList 或陣列都可以），三種輸入方式共用：點選
    // 檔案（現在的 <input type="file" multiple>，一次可以選很多張）、
    // 拖曳（一次拖進來的所有檔案）、貼上（剪貼簿裡的所有圖片項目）。
    // 每個檔案各自跟原本點檔案選取共用同一套 canAddImageToList_ 驗證
    // （格式/大小/張數/總量），全部跑完才重繪一次。
    function tryAddDroppedFiles_(list, files, rerenderFn) {
      if (!files) return;
      Array.prototype.forEach.call(files, function(file) {
        tryAddImageWithoutRerender_(list, file);
      });
      rerenderFn();

    // 只有 innerHTML 會變）綁上拖曳上傳。getListFn 是回傳「目前」清單陣列
    // 的函式（不是直接傳陣列本身）——清單在發文成功後會被整個重新指派成
    // 新的空陣列（例如 newArticleImageList = []），用函式包起來才能在每次
    // 真的拖放發生的當下讀到最新的陣列，不會綁到發文成功前的舊陣列參考。
    function wireImageDropZone_(containerId, getListFn, rerenderFn) {
      var el = document.getElementById(containerId);
      if (!el) return;
      el.addEventListener('dragover', function(event) {
        event.preventDefault(); // 沒有這行，瀏覽器預設行為是拒絕 drop
      });

        tryAddDroppedFiles_(getListFn(), files, rerenderFn);
      });
    }

    wireImageDropZone_('mobileNewArticleImageSlotsContainer', function() { return mobileNewArticleImageList; }, renderMobileNewArticleImageSlots);

    var PASTE_TARGET_CONFIG_ = {
      newArticleTitle: function() { return { list: newArticleImageList, rerender: renderNewArticleImageSlots }; },
      newArticleContent: function() { return { list: newArticleImageList, rerender: renderNewArticleImageSlots }; },
      mobileNewArticleTitle: function() { return { list: mobileNewArticleImageList, rerender: renderMobileNewArticleImageSlots }; },
      mobileNewArticleContent: function() { return { list: mobileNewArticleImageList, rerender: renderMobileNewArticleImageSlots }; },

    document.addEventListener('paste', function(event) {

    // 把已經驗證過的 File 陣列轉成 base64，供 google.script.run 傳給後端存進 Drive
    function readFilesAsBase64Payload(files) {
      var readers = files.map(function(file) {
        return new Promise(function(resolve, reject) {
          var reader = new FileReader();
          reader.onload = function() {
            var base64 = reader.result.split(',')[1]; // 去掉開頭的 "data:image/png;base64," 前綴
            resolve({ data: base64, mimeType: file.type, fileName: file.name });
          };
          reader.onerror = function() { reject(reader.error); };
          reader.readAsDataURL(file);
        });
      });
      return Promise.all(readers);
    }

    // 把 files（依原始選圖順序）依「原始位元組數」累加，切成多個總和不超過
    // IMAGE_UPLOAD_BATCH_BYTES 的批次。單一檔案本身就超過上限的情況理論上
    // 不會發生（單檔上限 MAX_IMAGE_SIZE_BYTES=5MB 遠小於這裡的批次上限），
    // 但還是讓它自成一批，不卡住整個流程。
    function chunkFilesByBytes_(files, maxBytes) {
      var batches = [];
      var current = [];
      var currentBytes = 0;
      files.forEach(function(file) {
        if (current.length > 0 && currentBytes + file.size > maxBytes) {
          batches.push(current);
          current = [];
          currentBytes = 0;
        }
        current.push(file);
        currentBytes += file.size;
      });
      if (current.length > 0) batches.push(current);
      return batches;
    }

    // 這支函式，就能把「新選圖片」全部換成已經上傳好的連結字串——不管
    // 選了幾張、多大，都不會再因為單次 google.script.run 的 payload 太大
    // 而整批失敗，使用者不用自己移除圖片重試。刻意不平行是因為後端的
    // 待用連結清單（見 Code.js 的 addPendingImageUrls_）是「讀出目前清單→
    // 加進去→整個寫回」，同一個 session 如果兩批同時送到，有可能其中一批
    // 的寫入把另一批的結果蓋掉；照順序一批做完再做下一批可以完全避開這個
    // 問題，換來的代價只是總時間變成批次數的線性疊加，換取正確性是值得的。
    // 回傳的 Promise resolve 成一個字串陣列；任何一批失敗就整個 reject。
    function uploadImagesInBatches(files) {
      if (!files || files.length === 0) {
        return Promise.resolve([]);
      }
      var batches = chunkFilesByBytes_(files, IMAGE_UPLOAD_BATCH_BYTES);
      var allUrls = [];
      return batches.reduce(function(chain, batchFiles) {
        return chain.then(function() {
          return readFilesAsBase64Payload(batchFiles).then(function(payloads) {
            return new Promise(function(resolve, reject) {
              google.script.run.withSuccessHandler(function(res) {
                if (res && res.success) {
                  allUrls = allUrls.concat(res.urls || []);
                  resolve();
                } else {
                  reject(new Error((res && res.error) || '圖片上傳失敗'));
                }
              }).withFailureHandler(function(err) {
                reject(err);
              }).uploadImageBatch(currentToken, payloads);
            });
          });
        });
      }, Promise.resolve()).then(function() {
        return allUrls;
      });
    }

    // ---- 發文表單（桌面）的圖片清單（圖片張數突破：原本固定 3 格，現在不定長） ----
    var newArticleImageList = [];

    function renderNewArticleImageSlots() {
      var container = document.getElementById('newArticleImageSlotsContainer');
      if (container) container.innerHTML = renderImageListHtml(newArticleImageList, 'addNewArticleImage', 'removeNewArticleImage', 'moveNewArticleImage');
    }

    function addNewArticleImage(inputEl) {
      tryAddDroppedFiles_(newArticleImageList, inputEl.files, renderNewArticleImageSlots);
      inputEl.value = ''; // 清空，不然選同一批檔案時瀏覽器不會再次觸發 change
    }

    function moveNewArticleImage(index, direction) {
      moveImageInList_(newArticleImageList, index, direction);
      renderNewArticleImageSlots();
    }

    function removeNewArticleImage(index) {
      newArticleImageList.splice(index, 1);
      renderNewArticleImageSlots();
    }

    // ---- 發文表單（手機全螢幕頁）的圖片清單，邏輯同上，狀態各自獨立 ----
    var mobileNewArticleImageList = [];

    function renderMobileNewArticleImageSlots() {
      var container = document.getElementById('mobileNewArticleImageSlotsContainer');
      if (container) container.innerHTML = renderImageListHtml(mobileNewArticleImageList, 'addMobileNewArticleImage', 'removeMobileNewArticleImage', 'moveMobileNewArticleImage');
    }

    function addMobileNewArticleImage(inputEl) {
      tryAddDroppedFiles_(mobileNewArticleImageList, inputEl.files, renderMobileNewArticleImageSlots);
      inputEl.value = ''; // 清空，不然選同一批檔案時瀏覽器不會再次觸發 change
    }

    function moveMobileNewArticleImage(index, direction) {
      moveImageInList_(mobileNewArticleImageList, index, direction);
      renderMobileNewArticleImageSlots();
    }

    function removeMobileNewArticleImage(index) {
      mobileNewArticleImageList.splice(index, 1);
      renderMobileNewArticleImageSlots();
    }

    // ---- 防連點造成重複送出 ----
    // 用「這個動作還在等 GAS 回應嗎」的旗標擋第二次點擊，不猜測固定時間間隔；
    // GAS 反應本來就不快，連點兩下常常在第一次還沒回來前就送出第二次，導致
    // 發文/回覆變兩篇，或刪除/編輯在極端情況下被同一個請求重複處理。
    // 旗標在送出前設成「進行中」，GAS 回應（不管成功或失敗）才解除——不是
    // 用固定時間間隔，這樣 GAS 快就快放行、慢就一直擋到真的回來為止。
    var pendingRequests = {};

    function isRequestPending(key) {
      return !!pendingRequests[key];
    }

    function beginRequest(key) {
      pendingRequests[key] = true;
    }

    function endRequest(key) {
      pendingRequests[key] = false;
    }

    // 複審 N-2（見對話紀錄，`/mycr` 三層審查發現）：這支函式跟下面的
    // handleMobilePostArticle 邏輯幾乎逐行對應（權限鎖定、按鈕禁用/還原、
    // 圖片上傳、成功後更新快取、isViewingBoard_ 判斷要不要刷新畫面、失敗
    // 處理），只有讀取的 DOM 元素 id 跟收尾動作（togglePostForm() vs
    // closeMobileCompose()）不同——評估過抽成共用函式的重構成本，暫緩執行
    // （這是 Index.html 的 glue 層，沒有自動化測試保護，純前端重構的風險
    // 跟目前這點重複帶來的維護成本不成比例，見對話紀錄），但這裡先留一個
    // 提醒：**改這支函式的邏輯時，記得檢查 handleMobilePostArticle 是不是
    // 也需要跟著改**（M-1 修補、送出回覆後切文章的競態問題修復，都需要在
    // 這兩支函式裡各自改一次同樣的邏輯）。之後如果有人要做前端更大範圍的
    // 重構，這裡是優先候選。
    function handlePostArticle() {
      if (isRequestPending('postArticle')) return; // 連點：已經有一個發文請求還在等 GAS 回應，直接跳過
      var title = document.getElementById('newArticleTitle').value;
      var content = document.getElementById('newArticleContent').value;
      if (!title || !content) { showToast('請填寫標題與內容', 'error'); return; }

      // bug-fix 輪：跟 handlePostReply 同一個成因——圖片上傳這段等待期間使用者
      // 可以切去別的看板，callback 裡不能讀當下可能已經變了的 currentBoardId
      var targetBoardId = currentBoardId;

      // 修正：旗標要在圖片開始上傳「之前」就鎖住，不能等 uploadImagesInBatches
      // resolve 之後才鎖。圖片上傳（尤其分批上傳）本身就會耗時，這段等待期間
      // 如果旗標還是 false，使用者在空檔連點好幾次「發布文章」，就會各自觸發
      // 一次全新的 uploadImagesInBatches，把同一批圖片重複上傳好幾份到雲端
      // 硬碟——旗標卻攔不住，因為它壓根還沒設起來。
      beginRequest('postArticle');

      // 順手把按鈕鎖住、改字樣：isRequestPending 擋下的第二次點擊原本完全沒有
      // 任何提示（單純 return），使用者容易誤以為第一下沒按到而一直重按。
      // 明確顯示「上傳中」才能讓人安心等待，而不是繼續連點。
      var submitBtn = document.getElementById('btnSubmitPostArticle');
      if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = '上傳中...'; }
      function restorePostArticleBtn_() {
        if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = '發布文章'; }
      }

      uploadImagesInBatches(filesFromImageList(newArticleImageList)).then(function(imageUrls) {
        google.script.run.withSuccessHandler(function(res) {
          endRequest('postArticle');
          restorePostArticleBtn_();
          if (res.success) {
            document.getElementById('newArticleTitle').value = '';
            document.getElementById('newArticleContent').value = '';
            newArticleImageList = [];
            renderNewArticleImageSlots();
            togglePostForm(); // 發文後自動收合表單——跟切去哪個看板無關，一律收合
            // 實際部署後發現的問題（見對話紀錄）：這裡本來漏了 content 跟
            // imageUrls，剛發表的文章點開後只看得到標題——loadArticleDetail
            // 找得到本地快取就直接信任、不重新呼叫伺服器（見該函式說明），
            // 缺欄位就顯示成空的，要整個重新進板才會因為走一次真正的整批
            // 讀取補回正確資料。content 前端本來就有，imageUrls 現在
            // postArticleFromForm 會一併回傳（見 Code.js 的說明）。
            var patched = patchArticleListOnCreate(targetBoardId, res.version, {
              articleId: res.articleId,
              boardId: targetBoardId,
              title: title,
              content: content,
              author: res.author,
              createdAt: res.createdAt,
              editedAt: '',
              editedBy: '',
              replyCount: 0,
              imageUrls: res.imageUrls || []
            });
            // 只在使用者「現在」還停留在同一個看板時才刷新看得到的列表，不然
            // 會把使用者已經切去的看板列表，硬換成剛剛發文那個看板的內容
            if (isViewingBoard_(targetBoardId)) {
              if (patched) { renderArticleListFromCache(targetBoardId); } else { loadArticles(targetBoardId); }
            }
          } else {
            showToast('發文失敗: ' + res.error, 'error');
          }
        }).withFailureHandler(function(err) {
          endRequest('postArticle');
          restorePostArticleBtn_();
          showToast('發文失敗，請稍後再試: ' + err.message, 'error');
        }).postArticleFromForm(currentToken, targetBoardId, title, content, imageUrls);
      }).catch(function(err) {
        // 修正：beginRequest('postArticle') 現在提早到上傳前就設了，
        // 上傳失敗也要記得 endRequest，不然旗標卡在 true，之後永遠按不動「發布文章」。
        endRequest('postArticle');
        restorePostArticleBtn_();
        showToast('圖片上傳失敗，請稍後再試: ' + err.message, 'error');
      });
    }

    // ticket 02：手機版全螢幕發文頁專用（沿用同一支 postArticleFromForm，只是欄位換成 mobile 專用的 input id）
    // 複審 N-2（見對話紀錄）：這支函式跟上面的 handlePostArticle 是同一組
    // 重複邏輯，評估細節見那邊的註解——**改這支函式時記得檢查桌面版
    // handlePostArticle 是不是也需要跟著改**，反之亦然。
    function handleMobilePostArticle() {
      if (isRequestPending('postArticle')) return; // 跟桌面版共用同一把鎖：同一時間本來就不可能兩邊同時發文

      // bug-fix 輪：跟桌面版 handlePostArticle 同一個成因，一併補上（手機版發文
      // 頁是全螢幕覆蓋，實務上使用者比較難在等待期間切看板，但保持跟桌面版
      // 同一套防護，避免之後兩邊行為不一致造成混淆）
      var targetBoardId = currentBoardId;

      // 修正（跟桌面版 handlePostArticle 同一個成因）：旗標提早到圖片上傳前就鎖住。
      beginRequest('postArticle');

      var mobileSubmitBtn = document.getElementById('btnSubmitMobilePostArticle');
      if (mobileSubmitBtn) { mobileSubmitBtn.disabled = true; mobileSubmitBtn.textContent = '上傳中...'; }
      function restoreMobilePostArticleBtn_() {
        if (mobileSubmitBtn) { mobileSubmitBtn.disabled = false; mobileSubmitBtn.textContent = '發布文章'; }
      }

      uploadImagesInBatches(filesFromImageList(mobileNewArticleImageList)).then(function(imageUrls) {
        google.script.run.withSuccessHandler(function(res) {
          endRequest('postArticle');
          restoreMobilePostArticleBtn_();
          if (res.success) {
            mobileNewArticleImageList = [];
            renderMobileNewArticleImageSlots();
            // 實際部署後發現的問題（見對話紀錄，跟桌面版 handlePostArticle
            // 是同一個成因）：這裡本來漏了 content 跟 imageUrls，補齊理由
            // 完全一樣，見桌面版那邊的說明。
            var patched = patchArticleListOnCreate(targetBoardId, res.version, {
              articleId: res.articleId,
              boardId: targetBoardId,
              title: title,
              content: content,
              author: res.author,
              createdAt: res.createdAt,
              editedAt: '',
              editedBy: '',
              replyCount: 0,
              imageUrls: res.imageUrls || []
            });
            if (isViewingBoard_(targetBoardId)) {
              if (patched) { renderArticleListFromCache(targetBoardId); } else { loadArticles(targetBoardId); }
            }
            closeMobileCompose(); // 送出成功後回到原本畫面（list 或 detail，見 history.back() 的說明）——跟切去哪個看板無關，一律照原本流程收合
          } else {
            showToast('發文失敗: ' + res.error, 'error');
          }
        }).withFailureHandler(function(err) {
          endRequest('postArticle');
          restoreMobilePostArticleBtn_();
          showToast('發文失敗，請稍後再試: ' + err.message, 'error');
        }).postArticleFromForm(currentToken, targetBoardId, title, content, imageUrls);
      }).catch(function(err) {
        endRequest('postArticle'); // 同上：上傳失敗也要解鎖，不然旗標卡死
        restoreMobilePostArticleBtn_();
        showToast('圖片上傳失敗，請稍後再試: ' + err.message, 'error');
