    function handlePostReply() {
      if (isRequestPending('postReply')) return;
      var content = document.getElementById('replyContentInput').value;
      if (!content) { showToast('請輸入回覆內容', 'error'); return; }

      // bug-fix 輪：送出當下就鎖定這則回覆屬於哪個看板/哪篇文章，callback 裡
      // 一律用這兩個區域變數，不要讀當下可能已經被使用者切走的全域變數（見上方
      // isViewingArticle_/isViewingBoard_ 說明區塊——這正是這次修的 bug 本身：
      // 使用者送出回覆後、伺服器還沒回應前點開了另一篇文章，回覆就錯誤地被
      // 套用到那篇「現在剛好顯示的」文章上）
      var targetBoardId = currentBoardId;
      var targetArticleId = currentArticleId;

      beginRequest('postReply');
      google.script.run.withSuccessHandler(function(res) {
        endRequest('postReply');
        if (res.success) {
          // 快取一律用 target 值更新，不管使用者現在切到哪裡，之後點回這篇
          // 文章看到的都會是最新資料
          var updatedDetail = patchArticleDetailOnReplyCreate(targetBoardId, targetArticleId, res.version, {
            replyId: res.replyId,
            articleId: targetArticleId,
            author: res.author,
            content: content,
            createdAt: res.createdAt
          });
          // 畫面（右側詳情面板）只在使用者「現在」還停留在同一篇文章時才更新，
          // 不然會把使用者已經切去看的其他文章畫面，硬拉回這篇文章
          if (isViewingArticle_(targetArticleId)) {
            if (updatedDetail) { lastArticleDetail = updatedDetail; renderArticleDetail(lastArticleDetail); }
            else { selectArticle(targetArticleId, null); }
          }
          patchArticleListReplyCount(targetBoardId, targetArticleId, 1);
        } else {
          showToast('回覆失敗: ' + res.error, 'error');
        }
      }).withFailureHandler(function(err) {
        endRequest('postReply');
        showToast('回覆失敗，請稍後再試: ' + err.message, 'error');
      }).postReplyFromForm(currentToken, targetArticleId, content);
    }

    // 8. 刪除文章 / 刪除留言（顯示與否已在 renderArticleDetail 依權限判斷）
    function handleDeleteArticle(articleId) {
      if (isRequestPending('deleteArticle')) return;
      // bug-fix 輪：跟 handleDeleteReply 同一個成因，showConfirm 跟
      // google.script.run 都還隔著非同步空檔，先鎖定看板
      var targetBoardId = currentBoardId;
      showConfirm('確定要刪除這篇文章嗎？留言也會一併刪除，此動作無法復原。', function() {
        beginRequest('deleteArticle');
        google.script.run.withSuccessHandler(function(res) {
          endRequest('deleteArticle');
          if (res.success) {
            var resolvedBoardId = res.boardId || targetBoardId;
            // 效能優化 ticket 05：文章沒了，patchArticleListOnDelete 已經會一併清掉
            // 統一快取裡對應的 articles/repliesByArticleId，這裡不用再另外處理——
            // 快取一律更新，不管使用者現在切到哪裡
            var patched = patchArticleListOnDelete(resolvedBoardId, res.version, articleId);
            // 畫面（右側詳情面板／手機返回列表）只在使用者「現在」還停留在
            // 剛剛刪掉的這篇文章時才動作——如果這段等待期間已經點去別的文章，
            // 不該無端把畫面清空或把手機畫面拉回列表
            if (isViewingArticle_(articleId)) {
              currentArticleId = '';
              document.getElementById('rightPanel').innerHTML = '<div class="placeholder-msg">👈 請從左側點選文章查看內容</div>';
              // 手機版：文章被刪掉了，畫面上不會再有「← 返回列表」按鈕，
              // 直接透過瀏覽器歷史記錄退回列表畫面（跟 backToList() 走同一條路徑）
              if (viewMode === 'mobile') {
                backToList();
              }
            }
            if (isViewingBoard_(resolvedBoardId)) {
              if (patched) { renderArticleListFromCache(resolvedBoardId); } else { loadArticles(resolvedBoardId); }
            }
          } else {
            showToast('刪除失敗: ' + res.error, 'error');
          }
        }).withFailureHandler(function(err) {
          endRequest('deleteArticle');
          showToast('刪除失敗，請稍後再試: ' + err.message, 'error');
        }).deleteArticleFromForm(currentToken, articleId);
      });
    }

      // bug-fix 輪：articleId 本身是參數（按鈕 onclick 當下就固定了，不會受

    // 9. 編輯文章（擁有者或 admin）
    function handleStartEditArticle() {
      // 圖片張數突破：把目前的圖片清單存進編輯用的暫存狀態（複製一份，
      // 不要共用同一個陣列參考，避免編輯過程中不小心動到快取裡的原始資料）
      var article = lastArticleDetail && lastArticleDetail.article;
      editImageList = (article && article.imageUrls) ? article.imageUrls.slice() : [];
      isEditingArticle = true;
      renderArticleDetail(lastArticleDetail);
    }

    function handleCancelEditArticle() {
      isEditingArticle = false;
      renderArticleDetail(lastArticleDetail);
    }

    // 圖片自動分批上傳：editImageList（字串=保留既有連結 / File 物件=新選的
    // 圖片）轉成要送給 editArticleFromForm 的格式。挑出所有 File，一次交給
    // uploadImagesInBatches 依大小自動分批上傳，拿回的連結依原本在
    // editImageList 裡的位置塞回去，字串原樣保留——回傳的陣列全部都是字串，
    // 跟後端 editArticleFromForm 現在只接受「已經上傳好的連結」一致，不用
    // 再把整批 base64 一次送進單一個 google.script.run 請求。
    function buildImageSlotsPayload() {
      var fileIndexes = [];
      var files = [];
      editImageList.forEach(function(slot, i) {
        if (slot instanceof File) {
          fileIndexes.push(i);
          files.push(slot);
        }
      });
      return uploadImagesInBatches(files).then(function(uploadedUrls) {
        var result = editImageList.slice();
        fileIndexes.forEach(function(slotIndex, j) {
          result[slotIndex] = uploadedUrls[j];
        });
        return result;
      });
    }

    function handleSaveEditArticle(articleId) {
      if (isRequestPending('saveEditArticle')) return;
      var title = document.getElementById('editArticleTitle').value;
      var content = document.getElementById('editArticleContent').value;
      if (!title || !content) { showToast('請填寫標題與內容', 'error'); return; }

      // bug-fix 輪：跟 handlePostReply 同一個成因——articleId 本身是參數（點
      // 「編輯」當下就固定了），但 currentBoardId 是全域變數，這裡到 callback
      // 之間隔著圖片上傳的非同步空檔，一樣要提早鎖定
      var targetBoardId = currentBoardId;

      // 修正（跟 handlePostArticle 同一個成因）：buildImageSlotsPayload 內部一樣會呼叫
      // uploadImagesInBatches，一樣要在上傳開始前就鎖旗標，不能等 resolve 才鎖，
      // 不然編輯文章時連點「儲存」也會把新選的圖片重複上傳好幾份。
      beginRequest('saveEditArticle');

      var saveBtn = document.getElementById('btnSaveEditArticle');
      if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = '上傳中...'; }
      function restoreSaveEditBtn_() {
        if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = '儲存'; }
      }

      buildImageSlotsPayload().then(function(imageSlots) {
        google.script.run.withSuccessHandler(function(res) {
          endRequest('saveEditArticle');
          restoreSaveEditBtn_();
          if (res.success) {
            var resolvedBoardId = res.boardId || targetBoardId;
            // 快取一律更新，不管使用者現在切到哪裡
            var updatedDetail = patchArticleDetailOnEdit(resolvedBoardId, articleId, res.articleVersion, title, content, res.editedAt, res.editedBy, res.imageUrls);
            var patched = patchArticleListOnEdit(resolvedBoardId, res.version, articleId, title);
            // 畫面只在使用者「現在」還停留在同一篇文章／同一個看板時才更新——
            // 不然會把使用者已經切走的畫面硬拉回這篇文章、或用舊看板的列表
            // 蓋掉現在正在看的看板列表
            if (isViewingArticle_(articleId)) {
              isEditingArticle = false;
              if (updatedDetail) { lastArticleDetail = updatedDetail; renderArticleDetail(lastArticleDetail); } else { loadArticleDetail(articleId); }
            }
            if (isViewingBoard_(resolvedBoardId)) {
              if (patched) { renderArticleListFromCache(resolvedBoardId); } else { loadArticles(resolvedBoardId); }
            }
          } else {
            showToast('儲存失敗: ' + res.error, 'error');
          }
        }).withFailureHandler(function(err) {
          endRequest('saveEditArticle');
          restoreSaveEditBtn_();
          showToast('儲存失敗，請稍後再試: ' + err.message, 'error');
        }).editArticleFromForm(currentToken, articleId, title, content, imageSlots);
      }).catch(function(err) {
        // 修正：beginRequest('saveEditArticle') 現在提早到上傳前就設了，
        // 上傳失敗也要 endRequest，不然「儲存」按鈕會永遠卡住按不動。
        endRequest('saveEditArticle');
        restoreSaveEditBtn_();
        showToast('圖片上傳失敗，請稍後再試: ' + err.message, 'error');
      });
    }

    // 10. 分享文章連結（任何看得到這篇文章的人都能分享；對方打開時仍會走一樣的權限檢查）。
    // 優先用原生分享（navigator.share）——手機上會跳出系統的分享面板（LINE/訊息/信件…）。
    // 使用者自己取消分享面板是正常操作，不當成錯誤處理。
    //
    // 修正：上一版把「複製成功」的確認訊息用 alert() 顯示，結果手機上還是看到同樣的
    // 問題——alert()／prompt()／confirm() 這三個原生對話框全部都會把目前頁面的真實
    // 網域（GAS 沙盒 iframe 的 ...script.googleusercontent.com）當成對話框標題一起
    // 顯示出來，這是瀏覽器自己的安全機制（讓使用者知道是「誰」在跳對話框），JS 沒有
    // 辦法關掉或客製化，只能整個不要用這三個函式。這裡全面改用自己畫的 UI：
    // showToast() 顯示「已複製」這種短暫確認訊息（見上方 .app-toast 樣式），
    // 複製失敗時開 shareLinkPopup（沿用既有的 .board-list-popup 樣式）取代 prompt()。
    // 不支援 navigator.share 的環境（例如桌面版舊瀏覽器）退回複製到剪貼簿；
    // 連剪貼簿 API 都失敗時才彈出分享連結彈窗。
    function handleShareArticle(boardId, articleId) {
      var link = scriptBaseUrl + '?board=' + encodeURIComponent(boardId) + '&article=' + encodeURIComponent(articleId);

      if (navigator.share) {
        navigator.share({ url: link }).catch(function(err) {
          if (err && err.name === 'AbortError') return; // 使用者自己取消分享面板，不是錯誤
          copyShareLinkOrShowPopup_(link);
        });
        return;
      }

      copyShareLinkOrShowPopup_(link);
    }

    // 判斷目前瀏覽器是否跑在 LINE 有原生 App 的平台（iOS / Android）。
    //
    // 修正記錄：原本以為「桌面版沒裝 LINE 時會被導去瀏覽器提示下載」，這個假設沒有
    // 實測過就寫進註解——使用者在桌面版（寬螢幕）實測後回報：桌面版點下去，
    // https://line.me/R/share?text=... 只是直接跳轉到 line.me 官網首頁，完全沒有
    // 分享功能，也沒有任何下載提示。查證後確認原因：這個 URL scheme 設計上是給手機
    // 瀏覽器攔截、轉交給 LINE App 處理的，本質上不是一個真正會回應內容的網頁；桌面版
    // 瀏覽器沒有 LINE App 可以攔截這個網址，line.me 收到這個路徑後就單純轉址回首頁。
    // 沒有找到官方文件記載的「LINE for PC 版分享」對應 URL scheme，與其留一個看起來
    // 存在、點下去卻沒作用的按鈕，改成只在偵測到手機作業系統時才顯示這顆按鈕
    // （見 renderArticleDetail 呼叫這支函式的地方）。桌面版使用者仍然可以用旁邊
    // 一律有效的「🔗 分享」按鈕（複製連結後自行貼到 LINE 桌面版即可）。
    function isMobileLineCapable_() {
      return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent || '');
    }

    // 分享到 LINE：用 LINE 官方文件記載的 URL scheme（https://line.me/R/share?text=...），
    // 開啟 LINE 的「分享對象」畫面，可以選好友、群組聊天，官方文件也明確寫「使用者也可以
    // 傳送到 Keep Memo」——所以這一支同時涵蓋「分享到 LINE 對話」跟「分享到 LINE
    // Keep」兩種需求，不需要另外做兩套。只支援 LINE for iOS / Android，按鈕本身也只在
    // isMobileLineCapable_() 為真時才會被畫出來（見上方說明），這裡的檢查是第二道防線。
    // 沿用 handleStartEditArticle 等既有函式的模式：不透過 inline 參數傳文章標題
    // （自由文字，直接塞進 onclick 屬性字串有跳脫風險），改成從 lastArticleDetail
    // 讀取目前正在顯示的文章。
    // 參考：https://developers.line.biz/en/docs/line-login/using-line-url-scheme/#send-text-message
    function handleShareToLine() {
      if (!isMobileLineCapable_()) return;
      var article = lastArticleDetail && lastArticleDetail.article;
      if (!article) return;
      var link = scriptBaseUrl + '?board=' + encodeURIComponent(article.boardId) + '&article=' + encodeURIComponent(article.articleId);
      var text = article.title + ' ' + link;
      window.open('https://line.me/R/share?text=' + encodeURIComponent(text), '_blank');
    }

    function copyShareLinkOrShowPopup_(link) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(function() {
          showToast('連結已複製到剪貼簿', 'success');
        }).catch(function() {
          openShareLinkPopup_(link);
        });
        return;
      }
      openShareLinkPopup_(link);
    }

    var shareLinkPopupValue_ = ''; // 分享連結彈窗目前顯示的連結，供「複製連結」按鈕讀取

    function openShareLinkPopup_(link) {
      shareLinkPopupValue_ = link;
      document.getElementById('shareLinkInput').value = link;
      document.getElementById('shareLinkPopup').classList.add('open');
    }

    function closeShareLinkPopup() {
      document.getElementById('shareLinkPopup').classList.remove('open');
    }

    function copyShareLinkFromPopup() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareLinkPopupValue_).then(function() {
          showToast('連結已複製到剪貼簿', 'success');
          closeShareLinkPopup();
        }).catch(function() {
          // 連使用者主動點按鈕（明確的 user gesture）當下都失敗，代表這個環境的剪貼簿
          // API 整個不能用——保留輸入框讓使用者自己長按選取、手動複製，不強制關窗
          document.getElementById('shareLinkInput').select();
        });
        return;
      }
      document.getElementById('shareLinkInput').select();
    }

    // 輕量提示：取代 alert() 顯示短暫確認/錯誤訊息，不會觸發原生對話框的網域顯示
    // 問題（見上方 .app-toast 樣式與 handleShareArticle 的說明）。同時間只保留一則
    // （新的一則會把還沒消失的舊的一則直接換掉，不會疊在一起）。
    // @param {string} message
    // @param {'success'|'error'} [type] - 預設 'success'；error 樣式是紅底，顯示
    //   時間也比較長（失敗訊息通常比「已複製」這種確認訊息長，需要多一點時間讀完）
    function showToast(message, type) {
      var existing = document.getElementById('appToast');
      if (existing) existing.remove();

      var toast = document.createElement('div');
      toast.id = 'appToast';
      toast.className = 'app-toast' + (type === 'error' ? ' error' : '');
      toast.textContent = message;
      document.body.appendChild(toast);

      requestAnimationFrame(function() {
        toast.classList.add('show');
      });

      var duration = (type === 'error') ? 4000 : 2500;
      setTimeout(function() {
        toast.classList.remove('show');
        setTimeout(function() { toast.remove(); }, 200);
      }, duration);
    }

    // 通用確認彈窗：取代 confirm()，理由同上。confirm() 是同步的（呼叫端可以直接
    // `if (!confirm(...)) return;`），DOM 彈窗天生是非同步的（要等使用者按按鈕），
    // 所以呼叫端要改成把「使用者按下確定之後才要做的事」包成 callback 傳進來，
    // 而不是直接檢查回傳值。
    // @param {string} message
    // @param {Function} onConfirm - 使用者按下「確定」時執行；按「取消」或點背景
    //   關閉則什麼都不做
    var confirmPopupOnConfirm_ = null;

    function showConfirm(message, onConfirm) {
      document.getElementById('confirmPopupMessage').textContent = message;
      confirmPopupOnConfirm_ = onConfirm;
      document.getElementById('confirmPopup').classList.add('open');
    }

    function closeConfirmPopup() {
      document.getElementById('confirmPopup').classList.remove('open');
      confirmPopupOnConfirm_ = null;
    }

    function handleConfirmPopupYes() {
      var callback = confirmPopupOnConfirm_;
      closeConfirmPopup();
      if (callback) callback();
    }

    // 工具函式：跳脫 HTML 避免 XSS
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
