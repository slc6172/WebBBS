<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BBS 系統</title>
  <style>
    /* ---- 淡雅風設計 token 層：只定義顏色/圓角/陰影的語意變數，下面所有規則
       改成引用這裡的變數，不新增/刪除任何選擇器、不動任何版面尺寸或斷點數字。
       之後要再調色只需要改這一區塊。 ---- */
    :root {
      /* 中性色階（暖灰調，取代原本偏藍的 slate 色階） */
      --color-bg: #F6F5F1;            /* 頁面底色，大部分時候會被兩側白色面板蓋住 */
      --color-surface: #FFFFFF;       /* 卡片/面板主背景 */
      --color-surface-muted: #F1F0E9; /* 淺色襯底：hover、次要區塊、圖片留白 */
      --color-border: #E4E1D7;        /* 一般分隔線/淺邊框 */
      --color-border-strong: #CFCBBC; /* 輸入框、按鈕外框，較明顯的邊框 */
      --color-text: #33352E;          /* 主要文字（標題、內文重點） */
      --color-text-secondary: #4E5049;/* 一般內文 */
      --color-text-muted: #83816E;    /* meta 資訊、輔助文字 */
      --color-text-faint: #ACA894;    /* 停用狀態、佔位文字 */

      /* 主色：鼠尾草／玉色調，取代原本飽和的品牌藍 */
      --color-primary: #5C8A70;
      --color-primary-hover: #4A7460;
      --color-primary-soft: #E3ECE5;  /* 選取列反白等大面積淺底 */

      /* 頂列：保留一塊深色當視覺錨點，改成深苔綠而不是深藍灰 */
      --color-topbar-bg: #303C34;
      --color-topbar-text: #F6F5F0;

      /* 語意色（危險/警告/未讀）：維持清楚可辨識的飽和度，只把色相往新色盤暖化，
         不做大幅降飽和——這幾個顏色的功能是警示，太淡會失去辨識度 */
      --color-danger: #B3492E;
      --color-danger-hover: #93381F;
      --color-warning-text: #A2660E;
      --color-warning-bg: #FBF3E1;

      /* 陰影統一用暖灰黑而不是純黑，跟整體暖色調一致 */
      --shadow-rgb: 58, 53, 44;
    }

    /* 1. 滿版與基礎佈局 */
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden; /* 鎖定外層，防止全頁滾動條 */
      background-color: var(--color-bg);
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* 2. 最上方固定列 (Top Bar) */
    .top-bar {
      height: 50px;
      background-color: var(--color-topbar-bg);
      color: var(--color-topbar-text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
      box-shadow: 0 2px 4px rgba(var(--shadow-rgb), 0.16);
      position: relative; /* .mobile-more-menu 用 position:absolute 定位，需要這裡當定位基準 */
    }
    .top-bar .logo {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 1.5px;
    }
    .top-bar .user-panel {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
    }
    .top-bar input {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--color-border-strong);
    }

    /* 3. 主區域雙欄分割 */
    .main-container {
      flex: 1;
      display: flex;
      height: calc(100vh - 50px);
      overflow: hidden;
    }

    /* 【左半部】: 看板選單 ➔ 高密度文章列表 ➔ 折疊發文區 */
    .left-panel {
      width: 380px;
      min-width: 320px;
      border-right: 1px solid var(--color-border-strong);
      display: flex;
      flex-direction: column;
      padding: 12px;
      background-color: var(--color-surface);
      gap: 8px;
      overflow-y: auto; /* 保險：main-container 是固定高度 + overflow:hidden，內容一旦超高，
                            沒有這個會被直接裁掉、完全碰不到，不是被擋住而已 */
    }

    .board-selector-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .board-selector-box select {
      flex: 1;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--color-border-strong);
      font-size: 0.95rem;
    }

    /* 左側文章列表 (高密度單行版面 + 獨立滾動) */
    .article-list-wrapper {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      background-color: var(--color-surface);
    }

    /* ---- 跳頁 pager bar：桌面/手機共用同一套，靠 flex 自然縮放，不需要另開
       @media 斷點——三個元件（◀／頁碼指示／▶）本身就夠窄，left-panel 在手機版
       是 100% 寬（見上面的 767px media query），一樣塞得下。頁碼指示中間那顆
       故意做成「按下去可以跳頁」的按鈕，不是純文字，參考 GitHub / Gmail 之類
       清單分頁常見的「當前頁 / 總頁數」可點擊樣式。 */
    .article-pager-bar {
      display: none; /* 預設隱藏；只有 totalPages > 1 時 renderPagerBar() 才會顯示，見 Index.html JS */
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      flex-shrink: 0;
    }
    .pager-arrow-btn {
      background: none;
      border: 1px solid var(--color-border-strong);
      border-radius: 6px;
      color: var(--color-text-secondary);
      width: 30px;
      height: 28px;
      flex-shrink: 0;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .pager-arrow-btn:hover:not(:disabled) { background-color: var(--color-surface-muted); }
    .pager-arrow-btn:disabled { color: var(--color-text-faint); border-color: var(--color-border); cursor: default; }
    .pager-page-indicator {
      flex: 1;
      min-width: 0; /* 讓 text-overflow 在窄寬度下真的生效 */
      background: none;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 0.8rem;
      color: var(--color-text-secondary);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    .pager-page-indicator:hover { background-color: var(--color-surface-muted); border-color: var(--color-border-strong); }

    /* 看板內搜尋（ticket 04）：搜尋框常駐，狀態列（結果數/清除搜尋/擴大範圍）
       在有搜尋時才出現，跟跳頁 bar 位置重疊、同一時間只會顯示其中一個 */
    .board-search-bar {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-shrink: 0;
    }
    .board-search-bar input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--color-border-strong);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 0.85rem;
    }
    .board-search-status-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      flex-shrink: 0;
      font-size: 0.78rem;
      color: var(--color-text-secondary);
    }
    .board-search-status-bar #searchResultCount {
      flex: 1;
      min-width: 0;
    }
    /* bug-fix 輪：手機窄寬度下這裡的 min-width:0 跟兩顆按鈕擠在同一行會逐字
       斷行，下面 767px media query 有覆蓋規則讓文字改成獨立佔滿一整行，
       這裡的 flex:1/min-width:0 只在桌面版夠寬的情況下才會是目前這個樣子。 */

    /* 單筆文章高密度樣式 (36px 高) */
    .article-item {
      padding: 6px 10px;
      border-bottom: 1px solid var(--color-border);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 36px;
      box-sizing: border-box;
      transition: background 0.1s;
    }
    .article-item:hover {
      background-color: var(--color-surface-muted);
    }
    .article-item.active {
      background-color: var(--color-primary-soft);
      border-left: 4px solid var(--color-primary);
    }
    .article-item .title {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--color-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      margin-right: 12px;
    }
    .article-item .meta {
      font-size: 0.78rem;
      color: var(--color-text-muted);
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    /* 未讀文章/新回覆徽章（ticket 01）：36px 單行版面空間有限，字級縮小塞進去。
       新文章＝標題前；已讀文章有新回覆＝回覆數前，兩者共用同一個樣式 */
    .badge-new {
      display: inline-block;
      font-size: 0.62rem;
      font-weight: 700;
      color: #ffffff;
      background-color: var(--color-danger);
      border-radius: 3px;
      padding: 0 3px;
      margin-right: 3px;
      line-height: 1.3;
      vertical-align: middle;
    }

    /* 左側按鈕與折疊發文區 */
    .btn-toggle-post {
      width: 100%;
      padding: 8px;
      background-color: var(--color-primary);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .btn-toggle-post:hover { background-color: var(--color-primary-hover); }

    .post-article-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--color-border-strong);
      border-radius: 8px;
      background-color: var(--color-surface-muted);
    }
    .post-article-form .form-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .post-article-form h4 { margin: 0; color: var(--color-text-secondary); }
    .post-article-form .btn-close {
      cursor: pointer;
      color: var(--color-text-muted);
      font-size: 0.9rem;
      font-weight: bold;
    }
    .post-article-form input,
    .post-article-form textarea {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--color-border-strong);
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .post-article-form textarea { height: 60px; resize: none; }

    /* 【右半部】: 文章詳細內文 ➔ 回覆列表 ➔ 回覆欄位 */
    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px;
      overflow-y: auto;
      background-color: var(--color-surface);
    }

    .article-detail-card {
      border-bottom: 2px solid var(--color-border);
      padding-bottom: 20px;
      margin-bottom: 20px;
    }
    .article-detail-card .header-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--color-text);
      margin-bottom: 8px;
    }
    .article-detail-card .header-meta {
      font-size: 0.85rem;
      color: var(--color-text-muted);
      margin-bottom: 16px;
    }
    .article-detail-card .body-content {
      font-size: 1rem;
      line-height: 1.6;
      color: var(--color-text-secondary);
      white-space: pre-wrap;
    }

    /* 回覆區塊 */
    .replies-section {
      margin-bottom: 24px;
    }
    .replies-section h4 { margin-bottom: 12px; color: var(--color-text-secondary); }
    .reply-item {
      padding: 10px 12px;
      border-radius: 6px;
      background-color: var(--color-surface-muted);
      margin-bottom: 8px;
    }
    .reply-item .reply-meta {
      font-size: 0.8rem;
      color: var(--color-text-muted);
      margin-bottom: 4px;
    }
    .reply-item .reply-content {
      font-size: 0.9rem;
      color: var(--color-text);
      white-space: pre-wrap;
    }

    /* 發送回覆區 */
    .post-reply-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--color-border);
    }
    .post-reply-form textarea {
      width: 100%;
      height: 70px;
      padding: 8px;
      border: 1px solid var(--color-border-strong);
      border-radius: 6px;
      resize: none;
    }

    /* 通用按鈕樣式 */
    button.btn-primary {
      padding: 6px 12px;
      background-color: var(--color-primary);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }
    button.btn-primary:hover { background-color: var(--color-primary-hover); }
    button.secondary { background-color: var(--color-text-muted); border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    button.secondary:hover { background-color: var(--color-text-secondary); }

    .placeholder-msg {
      color: var(--color-text-faint);
      text-align: center;
      margin-top: 100px;
      font-size: 1.1rem;
    }

    /* 響應式：手機版單畫面導覽 (斷點 768px，見 ticket 01) */
    .mobile-back-btn {
      display: none;
      margin-bottom: 12px;
      background: none;
      border: none;
      color: var(--color-primary);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 0;
    }

    /* ---- 手機導覽補強輪 ticket 01：手機版「上一篇／下一篇」固定按鈕 ----
       桌面版原本用 ↑/↓ 快捷鍵切換文章（見 JS 的 selectAdjacentArticle_），
       手機版沒有實體鍵盤，改用畫面上的固定按鈕當主要入口（另外還有滑動
       手勢，見 ticket 02 的 JS 說明）。按鈕永遠存在、用 disabled 表示
       「已經是最新/最舊一篇」，不是整顆按鈕隱藏——窄螢幕上隱藏按鈕容易
       讓版面跳動、手指也容易撲空點到別的東西，disabled 態就地顯示比較
       穩定。跟既有的 .pager-arrow-btn（翻頁箭頭鍵）配色一致但不共用同一個
       class：翻頁鍵是固定寬度的圖示鍵，這裡是要左右平分寬度的文字按鈕，
       排版邏輯不同，共用 class 之後兩邊要各自微調反而綁手綁腳。 */
    .mobile-article-nav-bar {
      display: none; /* 預設隱藏（含桌面版）；只有手機版斷點內、detail 畫面才顯示，見下方 media query */
      gap: 8px;
      margin-bottom: 12px;
    }
    .mobile-article-nav-btn {
      flex: 1;
      background: none;
      border: 1px solid var(--color-border-strong);
      border-radius: 6px;
      color: var(--color-text-secondary);
      padding: 7px 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .mobile-article-nav-btn:disabled { color: var(--color-text-faint); border-color: var(--color-border); cursor: default; }

    /* ---- ticket 02：手機版頂列「⋯」選單 ---- */
    /* 這條規則必須放在下面的 @media 區塊「之前」——兩條規則優先權(specificity)一樣，
       CSS 是「後面的贏」，如果這條放在 @media 後面，會把 @media 裡想要顯示它的
       規則蓋掉，導致手機版永遠看不到「⋯」按鈕（這正是這次回報的 bug 的根本原因）。 */
    .mobile-more-btn {
      display: none; /* 桌面版一律不顯示，下方 media query 在手機寬度會覆蓋成 inline-flex */
      background: none;
      border: 1px solid rgba(255,255,255,0.4);
      color: var(--color-topbar-text);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 1rem;
      cursor: pointer;
    }

    @media (max-width: 767px) {
      .left-panel {
        width: 100%;
        min-width: 0;
        border-right: none;
      }
      .right-panel {
        width: 100%;
      }
      /* body 上的 mobile-list / mobile-detail / mobile-compose class 由 JS 依導覽狀態切換，
         桌面版（無這些 class）完全不受影響 */
      body.mobile-list .right-panel { display: none; }
      body.mobile-detail .left-panel { display: none; }
      body.mobile-detail .mobile-back-btn { display: inline-block; }
      body.mobile-detail .mobile-article-nav-bar { display: flex; }

      /* ticket 02：手機版改用浮動 ➕ + 全螢幕發文頁，隱藏舊的內嵌折疊發文區 */
      #btnTogglePost, #postArticleForm { display: none !important; }

      .mobile-fab { display: none; }
      body.mobile-list .mobile-fab,
      body.mobile-detail .mobile-fab { display: flex; }

      .mobile-more-btn { display: inline-flex; }

      /* bug-fix 輪：手機版搜尋狀態列——「找到 N 篇符合的文章」這段文字跟兩顆
         按鈕（尤其「載入更早的文章再搜一次」字很長）原本擠在同一行，桌面版
         夠寬看不出問題，但手機窄寬度下文字可用空間被壓到不到一個中文字寬，
         中文沒有天然斷行點，逐字換行、整條狀態列被撐得很高，是同一種「按鈕
         擠壓文字」問題的另一個案例（跟下面 header-title 那個修法性質一樣）。
         這裡讓狀態列允許換行、文字那個 span 強制佔滿整行寬度——文字自己
         獨立一行後就有足夠空間，正常照 CSS 預設換行（不會再逐字斷行）；
         兩顆按鈕沒有被設 min-width:0（問題只出在文字那個 span 上），自然被
         推到下一行、彼此有足夠空間並排，擠不下時也只會整顆按鈕換到再下一行，
         不會有逐字斷行的問題。DOM 順序本來就是「文字在前、按鈕在後」，跟
         下面 header-title 的案例不同，不需要額外用 column-reverse 調換視覺
         順序。 */
      .board-search-status-bar {
        flex-wrap: wrap;
      }
      .board-search-status-bar #searchResultCount {
        flex-basis: 100%;
      }

      /* 手機版標題列：分享／LINE／編輯／刪除按鈕改佔獨立一列（顯示在上方），
         標題文字獨立佔下一列、有全部寬度可用，不會再被按鈕擠壓導致被迫換行。
         用 column-reverse 讓 DOM 順序（標題 span 在前、按鈕 div 在後）視覺上
         反過來變成「按鈕列在上、標題列在下」，不用動 JS 產生 HTML 的順序。
         這個元素本身有 style="...align-items:flex-start; gap:12px;" 這條行內
         樣式，行內樣式優先權天生高於這裡的一般 CSS 規則——flex-direction
         沒有行內衝突可以正常套用，但 align-items/gap 這兩個屬性如果不加
         !important 會被行內樣式蓋掉，實際上不會生效（gap 會停在原本的
         12px，不是這裡想要的 8px）。 */
      .article-detail-card .header-title {
        flex-direction: column-reverse;
        align-items: stretch !important;
        gap: 8px !important;
      }
      .article-detail-card .header-title > div {
        justify-content: flex-end;
      }
    }

    /* ---- ticket 02：手機版浮動發文按鈕 ---- */
    .mobile-fab {
      display: none; /* 桌面版一律不顯示，見上方 media query */
      position: fixed;
      right: 20px;
      bottom: 24px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background-color: var(--color-primary);
      color: #fff;
      border: none;
      font-size: 1.8rem;
      line-height: 1;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(var(--shadow-rgb), 0.22);
      cursor: pointer;
      z-index: 20;
    }
    .mobile-fab:hover { background-color: var(--color-primary-hover); }

    .mobile-more-menu {
      display: none;
      position: absolute;
      top: 100%;
      right: 12px;
      background: var(--color-surface);
      border: 1px solid var(--color-border-strong);
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(var(--shadow-rgb), 0.14);
      min-width: 180px;
      z-index: 30;
      overflow: hidden;
    }
    .mobile-more-menu.open { display: block; }
    .mobile-more-menu .mobile-more-item {
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      background: none;
      border: none;
      border-bottom: 1px solid var(--color-border);
      font-size: 0.9rem;
      color: var(--color-text);
      cursor: pointer;
    }
    .mobile-more-menu .mobile-more-item:last-child { border-bottom: none; }
    .mobile-more-menu .mobile-more-info {
      display: block;
      width: 100%;
      padding: 10px 14px;
      font-size: 0.85rem;
      color: var(--color-text-muted);
      border-bottom: 1px solid var(--color-border);
    }
    .mobile-more-menu .mobile-more-empty {
      padding: 10px 14px;
      font-size: 0.85rem;
      color: var(--color-text-faint);
    }

    /* ---- ticket 02：手機版全螢幕發文頁 ---- */
    .mobile-compose-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--color-surface);
      z-index: 40;
      flex-direction: column;
    }
    body.mobile-compose .main-container { display: none; }
    body.mobile-compose .mobile-compose-screen { display: flex; }
    .mobile-compose-header {
      height: 50px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      border-bottom: 1px solid var(--color-border);
    }
    .mobile-compose-header .mobile-back-btn { display: inline-block; margin-bottom: 0; }
    .mobile-compose-header h3 { margin: 0; font-size: 1.05rem; color: var(--color-text); }
    .mobile-compose-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .mobile-compose-body input,
    .mobile-compose-body textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--color-border-strong);
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .mobile-compose-body textarea { flex: 1; min-height: 200px; resize: none; }

    /* ---- ticket 06：看板列表彈窗 ---- */
    .board-selector-box { display: flex; align-items: center; gap: 8px; }
    .board-list-btn {
      background: none;
      border: 1px solid var(--color-border-strong);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.95rem;
      cursor: pointer;
      color: var(--color-text-secondary);
    }
    @media (max-width: 767px) {
      /* 手機版收進「⋯」選單，見 registerMoreMenuItem，避免跟下拉選單旁的按鈕重複 */
      .board-list-btn { display: none; }
      /* ticket 07：登入統計同理，手機版只在「⋯」選單裡顯示一次，不跟頂列重複 */
      .login-stats-badge { display: none; }
      /* ticket 08：排行榜按鈕同理 */
      .leaderboard-btn { display: none !important; }
    }
    .login-stats-badge {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.85);
    }
    .leaderboard-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.4);
      color: #fff;
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 0.85rem;
      cursor: pointer;
      margin-left: 10px;
    }
    .board-list-popup {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(46, 43, 36, 0.45);
      z-index: 50;
      align-items: center;
      justify-content: center;
    }
    .board-list-popup.open { display: flex; }
    .board-list-popup-content {
      background: var(--color-surface);
      border-radius: 8px;
      width: 90%;
      max-width: 420px;
      max-height: 70vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .board-list-popup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
    }
    .board-list-popup-header h3 { margin: 0; font-size: 1.05rem; color: var(--color-text); }
    .board-list-popup-close {
      background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--color-text-muted); line-height: 1;
    }
    .board-list-popup-body { overflow-y: auto; padding: 6px 0; }
    .board-list-popup-item {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      padding: 10px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--color-border);
    }
    .board-list-popup-item:hover { background: var(--color-surface-muted); }
    .board-list-popup-item .board-name { font-weight: 600; color: var(--color-text); }
    .board-list-popup-item .board-desc { font-size: 0.85rem; color: var(--color-text-muted); margin-top: 2px; }
    .board-badge {
      display: inline-block;
      background-color: var(--color-danger);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 10px;
      margin-left: 4px;
      vertical-align: middle;
    }

    /* ---- ticket 08：排行榜彈窗 ---- */
    .leaderboard-category { padding: 10px 16px; border-bottom: 1px solid var(--color-border); }
    .leaderboard-category:last-child { border-bottom: none; }
    .leaderboard-category h4 { margin: 0 0 6px 0; font-size: 0.95rem; color: var(--color-text); }
    .leaderboard-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      font-size: 0.9rem;
    }
    .leaderboard-rank { font-weight: 700; color: var(--color-primary); width: 28px; flex-shrink: 0; }
    .leaderboard-user { flex: 1; color: var(--color-text); }
    .leaderboard-value { color: var(--color-text-muted); }
    .leaderboard-empty { font-size: 0.85rem; color: var(--color-text-faint); }

    /* ---- ticket 09：圖片上傳區塊 ---- */
    .image-upload-box {
      border: 1px dashed var(--color-border-strong);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .image-upload-label { font-size: 0.85rem; color: var(--color-text-secondary); }
    .image-upload-warning { font-size: 0.78rem; color: var(--color-warning-text); background: var(--color-warning-bg); padding: 6px 8px; border-radius: 6px; }

    /* ---- ticket 09：文章下方圖片縮圖 ---- */
    .article-images {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 14px 0;
    }
    .article-images img {
      width: 120px;
      height: 120px;
      object-fit: contain; /* 完整顯示不裁切；cover 無論裁切錨點放哪都可能裁掉主體，改用 contain 保證縮圖看得到完整內容 */
      background-color: var(--color-surface-muted); /* 非正方形圖片的留白區域，跟站內其他中性色一致 */
      border-radius: 8px;
      border: 1px solid var(--color-border);
      cursor: pointer;
    }

    /* ---- ticket 10：燈箱 ---- */
    .lightbox-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 60;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .lightbox-overlay.open { display: flex; }
    .lightbox-overlay img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 6px;
      cursor: pointer;
    }
    .lightbox-close {
      position: fixed;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.6rem;
      cursor: pointer;
      z-index: 61;
    }

    /* ---- 輕量提示（app-toast）：取代 alert() 用來顯示「已複製」「發文失敗」之類的
       確認/錯誤訊息。原本用 alert()／prompt() 顯示分享連結時，手機瀏覽器會把 GAS
       沙盒 iframe 的真實網域（...script.googleusercontent.com）當成對話框標題一起
       顯示出來，看起來很雜亂——這是原生對話框的瀏覽器行為，JS 無法關掉，唯一的
       辦法是完全不用 alert()／prompt()／confirm()，改用自己畫的元素。z-index 故意
       比所有既有彈窗都高，確保就算在彈窗裡按下觸發，提示還是會蓋在最上層。
       error 樣式（紅底）用在失敗訊息，維持比預設稍長的顯示時間——失敗訊息通常
       比「已複製」這種確認訊息長，需要多一點時間讀完（見 showToast 的 duration 參數）。 */
    .app-toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(12px);
      background: rgba(48, 45, 38, 0.92);
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
      max-width: 85vw;
      text-align: center;
      box-shadow: 0 4px 12px rgba(var(--shadow-rgb), 0.18);
    }
    .app-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .app-toast.error {
      background: rgba(179, 73, 46, 0.94);
    }

    /* ---- 通用確認彈窗（confirmPopup）：取代 confirm()，理由同上方 app-toast 的
       說明。沿用 .board-list-popup 的彈窗外殼，內容區自訂成「訊息 + 取消/確定」
       兩顆按鈕的簡單版面。 */
    .confirm-popup-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .confirm-popup-actions button {
      flex: 1;
      padding: 8px;
    }
    button.btn-danger {
      background-color: var(--color-danger);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }
    button.btn-danger:hover { background-color: var(--color-danger-hover); }

    /* ---- 修正圖片選擇框排版 ---- */
    .edit-image-slots {
      display: flex;
      gap: 6px; /* 縮小間距（原 8px） */
      flex-wrap: nowrap; /* 強制不換行 */
      margin-bottom: 8px;
      width: 100%;
    }
    .edit-image-slot {
      flex: 1; /* 彈性均分寬度，取代固定 100px */
      min-width: 0; /* 允許縮小到比內容還窄，不然原生 file input 的最小寬度會撐開整列 */
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
    }
    .edit-image-slot img {
      width: 100%; /* 寬高隨容器等比例縮放 */
      aspect-ratio: 1 / 1; /* 維持正方形 */
      height: auto;
      object-fit: contain; /* 跟 .article-images img 一致：完整顯示不裁切，避免預覽跟實際上傳內容不一致 */
      background-color: var(--color-surface-muted);
      border-radius: 8px;
      border: 1px solid var(--color-border);
      box-sizing: border-box;
    }
    .edit-image-slot input[type="file"] {
      width: 100%; /* 寬度跟隨容器 */
      aspect-ratio: 1 / 1; /* 跟已選圖片的格子一致，維持正方形，避免空格/已選格高度不一致 */
      height: auto;
      border: 1px dashed var(--color-border-strong);
      border-radius: 8px;
      font-size: 0.7rem;
      padding: 2px;
      box-sizing: border-box;
    }
    /* 圖片排序按鈕（ticket 03）：跟既有的移除按鈕同一排，slot 很窄（選很多張
       圖片時）也不會被截斷，允許換行 */
    .edit-image-slot-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      justify-content: center;
    }
    .edit-image-slot-actions button:disabled {
      opacity: 0.4;
      cursor: default;
    }
  </style>
</head>
<body>

  <!-- 1. 最上方固定列 -->
  <header class="top-bar">
    <div class="logo">BBS 討論區</div>
    <button type="button" class="leaderboard-btn" id="leaderboardBtn" onclick="openLeaderboardPopup()" style="display:none;">🏆 排行榜</button>
    <div class="user-panel" id="userPanel">
      <!-- 登入狀態由 JavaScript 初始化載入 -->
    </div>
    <div class="mobile-more-menu" id="mobileMoreMenu">
      <!-- 內容由 JS 的 registerMoreMenuItem()/renderMoreMenu() 動態產生，見 ticket 06 -->
    </div>
  </header>

  <!-- 2. 下方雙欄主區域 -->
  <main class="main-container">

    <!-- 【左半部】：看板下拉選單 ➔ 文章列表 ➔ 折疊發文區 -->
    <section class="left-panel">
      <!-- 看板下拉選單 -->
      <div class="board-selector-box">
        <label for="boardSelect"><strong>看板：</strong></label>
        <select id="boardSelect" onchange="onBoardChange()">
          <option value="">載入看板中...</option>
        </select>
        <button type="button" class="board-list-btn" onclick="openBoardListPopup()" title="看板列表">📋 看板列表</button>
      </div>

      <!-- 看板內搜尋（ticket 04）：常駐輸入框，Enter 或按鈕才觸發，不做
           即時邊打邊搜。優先比對 boardBulkCache 裡已載入的資料，零額外
           試算表讀取；範圍固定是目前所在看板，不做跨看板搜尋。 -->
      <div class="board-search-bar" id="boardSearchBar">
        <input type="text" id="boardSearchInput" placeholder="🔍 搜尋這個看板的文章/回覆..."
          onkeydown="if (event.key === 'Enter') runSearch_()" />
        <button type="button" class="secondary" onclick="runSearch_()">搜尋</button>
      </div>

      <!-- 跳頁 bar：只有看板文章數超過一頁才會顯示（見 renderPagerBar），放在列表
           正上方而不是像「載入更早的文章」那樣放在清單最下面，是因為文章一多，
           使用者不太可能願意先滑到底才找到跳頁入口 -->
      <div class="article-pager-bar" id="articlePagerBar">
        <button type="button" class="pager-arrow-btn" id="pagerPrevBtn" onclick="pagerGoRelative(-1)" title="回到較新的一頁">◀</button>
        <button type="button" class="pager-page-indicator" id="pagerPageIndicator" onclick="openPageJumpPopup()"></button>
        <button type="button" class="pager-arrow-btn" id="pagerNextBtn" onclick="pagerGoRelative(1)" title="翻到較舊的一頁">▶</button>
      </div>

      <!-- 搜尋結果狀態列（ticket 04）：搜尋模式時取代上面的跳頁 bar，
           搜尋模式跟跳頁是互斥的兩種列表檢視方式 -->
      <div class="board-search-status-bar" id="boardSearchStatusBar" style="display:none;">
        <span id="searchResultCount"></span>
        <button type="button" class="secondary" id="searchLoadMoreBtn" style="display:none;" onclick="loadMoreArticles(currentBoardId)">載入更早的文章再搜一次</button>
        <button type="button" class="secondary" onclick="clearSearch_()">✕ 清除搜尋</button>
      </div>

      <!-- 文章標題列表 (單行高密度) -->
      <div class="article-list-wrapper" id="articleList">
        <div class="placeholder-msg" style="margin-top: 40px; font-size: 0.9rem;">請選擇看板</div>
      </div>

      <!-- 折疊式發文按鈕與表單 -->
      <button class="btn-toggle-post" id="btnTogglePost" onclick="togglePostForm()" style="display:none;">+ 發表新文章</button>

      <div class="post-article-form" id="postArticleForm" style="display: none;">
        <div class="form-header">
          <h4>發表新文章</h4>
          <span class="btn-close" onclick="togglePostForm()">✕ 關閉</span>
        </div>
        <input type="text" id="newArticleTitle" placeholder="文章標題" />
        <textarea id="newArticleContent" placeholder="撰寫文章內容..."></textarea>
        <div class="image-upload-box">
          <label class="image-upload-label">📷 附加圖片（最多 99 張，jpg/png/gif/webp，單張上限 5MB；可點選、拖曳或貼上剪貼簿圖片，選多了會自動分批上傳，不用自己拆）</label>
          <div id="newArticleImageSlotsContainer"></div>
          <div class="image-upload-warning">⚠️ 圖片連結為公開分享連結（知道連結就能看），請勿上傳含敏感內容的圖片</div>
        </div>
        <button class="btn-primary" id="btnSubmitPostArticle" onclick="handlePostArticle()">發布文章</button>
      </div>
    </section>

    <!-- 【右半部】：文章詳細內文 + 回覆列表 + 留言區 -->
    <section class="right-panel" id="rightPanel">
      <div class="placeholder-msg">👈 請從左側點選文章查看內容</div>
    </section>

  </main>

  <!-- ticket 02：手機版浮動發文按鈕（list/detail 畫面下皆可點擊） -->
  <button type="button" class="mobile-fab" id="mobileFabBtn" onclick="openMobileCompose()" title="發表新文章" style="display:none;">+</button>

  <!-- ticket 02：手機版全螢幕發文頁（編輯文章沿用 ticket 01 已經全寬的 detail 畫面，不需要另一個全螢幕頁） -->
  <section class="mobile-compose-screen" id="mobileComposeScreen">
    <div class="mobile-compose-header">
      <button type="button" class="mobile-back-btn" onclick="closeMobileCompose()">← 返回</button>
      <h3>發表新文章</h3>
    </div>
    <div class="mobile-compose-body">
      <input type="text" id="mobileNewArticleTitle" placeholder="文章標題" />
      <textarea id="mobileNewArticleContent" placeholder="撰寫文章內容..."></textarea>
      <div class="image-upload-box">
        <label class="image-upload-label">📷 附加圖片（最多 99 張，jpg/png/gif/webp，單張上限 5MB；可點選、拖曳或貼上剪貼簿圖片，選多了會自動分批上傳，不用自己拆）</label>
        <div id="mobileNewArticleImageSlotsContainer"></div>
        <div class="image-upload-warning">⚠️ 圖片連結為公開分享連結（知道連結就能看），請勿上傳含敏感內容的圖片</div>
      </div>
      <button class="btn-primary" id="btnSubmitMobilePostArticle" onclick="handleMobilePostArticle()">發布文章</button>
    </div>
  </section>

  <!-- ticket 06：看板列表彈窗 -->
  <div class="board-list-popup" id="boardListPopup" onclick="if (event.target === this) closeBoardListPopup()">
    <div class="board-list-popup-content">
      <div class="board-list-popup-header">
        <h3>所有看板</h3>
        <button type="button" class="board-list-popup-close" onclick="closeBoardListPopup()">✕</button>
      </div>
      <div class="board-list-popup-body" id="boardListPopupBody"></div>
    </div>
  </div>

  <!-- 跳頁彈窗：沿用看板列表彈窗同一套 .board-list-popup 樣式（手機/桌面都已經是
       置中、90% 寬、max-width 420px，不需要再另外處理窄寬度） -->
  <div class="board-list-popup" id="pageJumpPopup" onclick="if (event.target === this) closePageJumpPopup()">
    <div class="board-list-popup-content" style="max-width: 300px;">
      <div class="board-list-popup-header">
        <h3>跳到指定頁</h3>
        <button type="button" class="board-list-popup-close" onclick="closePageJumpPopup()">✕</button>
      </div>
      <div class="board-list-popup-body" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;">
        <div id="pageJumpHint" style="font-size: 0.85rem; color: var(--color-text-muted);"></div>
        <div style="display: flex; gap: 8px;">
          <input type="number" id="pageJumpInput" min="1" step="1" inputmode="numeric"
                 style="flex: 1; min-width: 0; padding: 8px; border: 1px solid var(--color-border-strong); border-radius: 6px; font-size: 1rem;"
                 onkeydown="if (event.key === 'Enter') submitPageJump()">
          <button type="button" class="btn-primary" onclick="submitPageJump()">跳頁</button>
        </div>
        <div style="display: flex; gap: 8px;">
          <button type="button" class="secondary" style="flex: 1;" onclick="jumpToPage(currentBoardId, 0)">⏮ 回到最新</button>
          <button type="button" class="secondary" style="flex: 1;" onclick="jumpToLastPage()">⏭ 跳到最早</button>
        </div>
      </div>
    </div>
  </div>

  <!-- @提及輪 ticket 06：登入時的提及通知彈窗，沿用同一套 .board-list-popup
       樣式。只在登入成功後、有非空的 pendingMentions 時才會被打開（見
       showPendingMentionsModalIfAny_），內容全部由 JS 動態產生。 -->
  <div class="board-list-popup" id="pendingMentionsPopup" onclick="if (event.target === this) closePendingMentionsPopup()">
    <div class="board-list-popup-content">
      <div class="board-list-popup-header">
        <h3>💬 有人提到你</h3>
        <button type="button" class="board-list-popup-close" onclick="closePendingMentionsPopup()">✕</button>
      </div>
      <div class="board-list-popup-body" id="pendingMentionsPopupBody"></div>
    </div>
  </div>

  <!-- 分享連結彈窗：navigator.share 不支援、或連 navigator.clipboard 都失敗時的最後手段，
       取代原本的 prompt()——原生 prompt() 在手機上會把 GAS 沙盒 iframe 的網域當標題
       顯示出來，改用自己畫的彈窗完全避開這個問題。輸入框設唯讀＋點擊全選，方便使用者

  <div class="board-list-popup" id="shareLinkPopup" onclick="if (event.target === this) closeShareLinkPopup()">

      <div class="board-list-popup-header">

        <input type="text" id="shareLinkInput" readonly onclick="this.select();"
               style="padding: 8px; border: 1px solid var(--color-border-strong); border-radius: 6px; font-size: 0.85rem; color: var(--color-text);">
        <button type="button" class="btn-primary" onclick="copyShareLinkFromPopup()">複製連結</button>
      </div>
    </div>
  </div>

  <!-- 通用確認彈窗：取代 confirm()，理由見上方 .app-toast 的說明。訊息文字跟「確定」
       按鈕點下去要做的事，都由呼叫 showConfirm() 的地方臨時指定，這個彈窗本身不

  <div class="board-list-popup" id="confirmPopup" onclick="if (event.target === this) closeConfirmPopup()">

        <div class="confirm-popup-actions">
          <button type="button" class="secondary" onclick="closeConfirmPopup()">取消</button>
          <button type="button" class="btn-danger" onclick="handleConfirmPopupYes()">確定</button>

  <div class="board-list-popup" id="leaderboardPopup" onclick="if (event.target === this) closeLeaderboardPopup()">
